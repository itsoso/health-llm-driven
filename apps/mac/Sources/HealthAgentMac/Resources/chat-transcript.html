<!DOCTYPE html>
<!--
  Chat transcript shell for the WKWebView-backed assistant conversation.
  纯本地、零网络:无 <script src>、无 <link href>、无字体 CDN。所有 CSS/JS 内联。
  消息 HTML 由 Swift 侧 ChatTranscriptHTML 预转义后注入,JS 仅做 DOM append/scroll/copy 桥接。
-->
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --font-scale: 1;
    --base-size: 14px;
    --bubble-radius: 14px;
    --gap: 14px;

    --bg: transparent;
    --user-bubble: rgba(10, 132, 255, 0.16);
    --user-border: rgba(10, 132, 255, 0.30);
    --assistant-bubble: rgba(120, 120, 128, 0.10);
    --assistant-border: rgba(120, 120, 128, 0.16);
    --text: #1d1d1f;
    --secondary: rgba(60, 60, 67, 0.6);
    --accent: #0a84ff;
    --code-bg: rgba(120, 120, 128, 0.14);
    --table-border: rgba(120, 120, 128, 0.28);
    --hr: rgba(120, 120, 128, 0.3);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --user-bubble: rgba(10, 132, 255, 0.28);
      --user-border: rgba(10, 132, 255, 0.42);
      --assistant-bubble: rgba(120, 120, 128, 0.18);
      --assistant-border: rgba(255, 255, 255, 0.08);
      --text: #f5f5f7;
      --secondary: rgba(235, 235, 245, 0.6);
      --accent: #4aa3ff;
      --code-bg: rgba(255, 255, 255, 0.10);
      --table-border: rgba(255, 255, 255, 0.18);
      --hr: rgba(255, 255, 255, 0.16);
    }
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif;
    font-size: calc(var(--base-size) * var(--font-scale));
    -webkit-font-smoothing: antialiased;
    -webkit-user-select: text;
    user-select: text;
  }
  #transcript {
    display: flex;
    flex-direction: column;
    gap: var(--gap);
    padding: 8px 4px 16px 4px;
    max-width: 860px;
    margin: 0 auto;
  }
  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .row.assistant { justify-content: flex-start; }

  .bubble {
    border-radius: var(--bubble-radius);
    padding: 12px 14px;
    border: 1px solid transparent;
    line-height: 1.55;
    overflow-wrap: anywhere;
    word-break: break-word;
  }
  .row.user .bubble {
    background: var(--user-bubble);
    border-color: var(--user-border);
    max-width: 620px;
  }
  .row.assistant .bubble {
    background: var(--assistant-bubble);
    border-color: var(--assistant-border);
    max-width: 100%;
    width: 100%;
  }

  .meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 0.78em;
    font-weight: 600;
    color: var(--secondary);
    margin-bottom: 6px;
  }
  .copy-btn {
    cursor: pointer;
    border: none;
    background: transparent;
    color: var(--secondary);
    font-size: 0.95em;
    padding: 2px 6px;
    border-radius: 6px;
  }
  .copy-btn:hover { background: var(--code-bg); color: var(--accent); }
  .copy-btn.copied { color: #34c759; }

  .body > *:first-child { margin-top: 0; }
  .body > *:last-child { margin-bottom: 0; }
  .body p { margin: 0.5em 0; }
  .body h1, .body h2 { font-size: 1.18em; font-weight: 700; margin: 0.7em 0 0.4em; }
  .body h3, .body h4 { font-size: 1.05em; font-weight: 600; margin: 0.6em 0 0.3em; }
  .body ul, .body ol { margin: 0.4em 0; padding-left: 1.4em; }
  .body li { margin: 0.2em 0; }
  .body code {
    background: var(--code-bg);
    padding: 0.1em 0.35em;
    border-radius: 5px;
    font-family: "SF Mono", ui-monospace, Menlo, monospace;
    font-size: 0.9em;
  }
  .body hr { border: none; border-top: 1px solid var(--hr); margin: 0.8em 0; }
  .body table {
    border-collapse: collapse;
    margin: 0.6em 0;
    width: 100%;
    font-size: 0.95em;
  }
  .body th, .body td {
    border: 1px solid var(--table-border);
    padding: 5px 9px;
    text-align: left;
    vertical-align: top;
  }
  .body th { font-weight: 600; background: var(--code-bg); }
  .body .streaming-text { white-space: pre-wrap; }
  .attachment-images {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(92px, 140px));
    gap: 8px;
    margin-top: 8px;
  }
  .attachment-image-link {
    display: block;
    overflow: hidden;
    border-radius: 10px;
    border: 1px solid var(--table-border);
    background: var(--code-bg);
  }
  .attachment-image {
    display: block;
    width: 100%;
    max-height: 180px;
    object-fit: cover;
  }

  .dynamic-card {
    margin: 2px 0 10px;
    padding: 12px;
    border-radius: 12px;
    border: 1px solid rgba(48, 176, 112, 0.24);
    background: linear-gradient(180deg, rgba(48, 176, 112, 0.12), rgba(48, 176, 112, 0.05));
  }
  .dynamic-card + p,
  .dynamic-card + div.streaming-text {
    margin-top: 10px;
  }
  .dynamic-card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 10px;
  }
  .dynamic-card-eyebrow {
    font-size: 0.76em;
    font-weight: 700;
    color: var(--secondary);
    margin-bottom: 2px;
  }
  .dynamic-card-title {
    font-size: 1.06em;
    font-weight: 800;
    color: var(--text);
    letter-spacing: 0;
  }
  .dynamic-card-badge {
    flex: 0 0 auto;
    padding: 3px 8px;
    border-radius: 999px;
    font-size: 0.78em;
    font-weight: 800;
    border: 1px solid transparent;
  }
  .dynamic-card-badge.risk {
    color: #b42318;
    background: rgba(255, 69, 58, 0.14);
    border-color: rgba(255, 69, 58, 0.22);
  }
  .dynamic-card-badge.neutral {
    color: #177245;
    background: rgba(48, 176, 112, 0.14);
    border-color: rgba(48, 176, 112, 0.22);
  }
  .dynamic-card-badge.caution {
    color: #8a5a00;
    background: rgba(255, 214, 10, 0.16);
    border-color: rgba(255, 214, 10, 0.24);
  }
  .dynamic-card-metrics {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(92px, 1fr));
    gap: 8px;
  }
  .dynamic-card-metric {
    min-width: 0;
    padding: 7px 8px;
    border-radius: 8px;
    border: 1px solid rgba(120, 120, 128, 0.14);
    background: rgba(255, 255, 255, 0.52);
  }
  .dynamic-card-metric-label {
    font-size: 0.72em;
    font-weight: 700;
    color: var(--secondary);
  }
  .dynamic-card-metric-value {
    margin-top: 2px;
    font-size: 0.9em;
    font-weight: 800;
    color: var(--text);
  }
  .dynamic-card-metric-value.risk {
    color: #b42318;
  }
  .dynamic-card-detail,
  .dynamic-card-conclusion,
  .dynamic-card-next,
  .dynamic-card-warning {
    margin-top: 8px;
    font-size: 0.88em;
  }
  .dynamic-card-detail,
  .dynamic-card-next {
    color: var(--secondary);
  }
  .dynamic-card-conclusion {
    color: var(--text);
    font-weight: 650;
  }
  .dynamic-card-warning {
    padding: 7px 8px;
    border-radius: 8px;
    color: #8a5a00;
    background: rgba(255, 214, 10, 0.14);
    border: 1px solid rgba(255, 214, 10, 0.24);
  }
  .evidence-card,
  .generic-card {
    border-color: rgba(10, 132, 255, 0.20);
    background: linear-gradient(180deg, rgba(10, 132, 255, 0.11), rgba(10, 132, 255, 0.045));
  }
  .safety-card-risk {
    border-color: rgba(255, 69, 58, 0.24);
    background: linear-gradient(180deg, rgba(255, 69, 58, 0.12), rgba(255, 69, 58, 0.05));
  }
  .safety-card-caution {
    border-color: rgba(255, 214, 10, 0.24);
    background: linear-gradient(180deg, rgba(255, 214, 10, 0.14), rgba(255, 214, 10, 0.05));
  }
  .safety-card-info {
    border-color: rgba(10, 132, 255, 0.20);
    background: linear-gradient(180deg, rgba(10, 132, 255, 0.10), rgba(10, 132, 255, 0.04));
  }
  .safety-card-summary {
    color: var(--text);
    font-weight: 700;
    line-height: 1.5;
  }
  .safety-card-recommendations {
    display: grid;
    gap: 6px;
    margin: 9px 0 0;
    padding: 0;
    list-style: none;
  }
  .safety-card-recommendations li {
    margin: 0;
    padding: 6px 8px;
    border-radius: 8px;
    border: 1px solid rgba(120, 120, 128, 0.14);
    background: rgba(255, 255, 255, 0.52);
    color: var(--text);
    font-size: 0.86em;
  }
  .safety-card-attention {
    display: inline-block;
    margin-top: 9px;
    padding: 3px 8px;
    border-radius: 999px;
    color: #b42318;
    background: rgba(255, 69, 58, 0.12);
    border: 1px solid rgba(255, 69, 58, 0.20);
    font-size: 0.78em;
    font-weight: 800;
  }
  .dynamic-card-summary {
    display: grid;
    gap: 6px;
  }
  .dynamic-card-summary-row {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    padding: 6px 0;
    border-top: 1px solid rgba(120, 120, 128, 0.16);
    color: var(--secondary);
    font-size: 0.86em;
  }
  .dynamic-card-summary-row strong {
    color: var(--text);
    font-weight: 700;
    text-align: right;
  }
  @media (prefers-color-scheme: dark) {
    .dynamic-card-metric {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.08);
    }
    .dynamic-card-badge.risk,
    .dynamic-card-metric-value.risk {
      color: #ff8a80;
    }
    .dynamic-card-badge.neutral {
      color: #7ee0a3;
    }
    .dynamic-card-badge.caution {
      color: #ffd66b;
    }
    .safety-card-recommendations li {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.08);
    }
    .safety-card-attention {
      color: #ff8a80;
      background: rgba(255, 69, 58, 0.10);
      border-color: rgba(255, 69, 58, 0.18);
    }
    .dynamic-card-warning {
      color: #ffd66b;
      background: rgba(255, 214, 10, 0.10);
      border-color: rgba(255, 214, 10, 0.18);
    }
  }

  /* meta footer (模型 · 轮数 · 耗时 / 数据源 / Skill) — 低调灰、小字号,不喧宾夺主 */
  .meta-footer {
    margin-top: 8px;
    padding-top: 6px;
    border-top: 1px solid var(--hr);
    display: flex;
    flex-direction: column;
    gap: 5px;
    font-size: 0.78em;
    color: var(--secondary);
  }
  .meta-footer .meta-line { color: var(--secondary); }
  .meta-footer details.meta-sources { color: var(--secondary); }
  .meta-footer details.meta-sources > summary {
    cursor: pointer;
    list-style: none;
    color: var(--secondary);
    user-select: none;
  }
  .meta-footer details.meta-sources > summary::-webkit-details-marker { display: none; }
  .meta-footer details.meta-sources > summary::before {
    content: "▸ ";
    color: var(--secondary);
  }
  .meta-footer details.meta-sources[open] > summary::before { content: "▾ "; }
  .meta-footer details.meta-sources ul {
    margin: 4px 0 0;
    padding-left: 1.2em;
  }
  .meta-footer details.meta-sources li { margin: 1px 0; }
  .meta-footer .meta-tools {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 5px;
  }
  .meta-footer .meta-tools-label { color: var(--secondary); }
  .meta-footer .meta-chip {
    display: inline-block;
    padding: 1px 7px;
    border-radius: 10px;
    border: 1px solid var(--assistant-border);
    background: var(--code-bg);
    color: var(--secondary);
    font-size: 0.95em;
  }

  /* GenUI reva-ui 折线图(JS 自绘 SVG,离线;占位 div 由 Swift 注入) */
  .reva-ui-chart {
    margin: 6px 0 10px;
    padding: 12px 12px 8px;
    border-radius: 12px;
    border: 1px solid var(--table-border);
    background: rgba(120, 120, 128, 0.06);
    color: var(--secondary);
    font-size: 0.86em;
  }
  .reva-ui-chart.rendered { color: var(--text); }
  .reva-ui-title {
    font-size: 0.95em;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 2px;
  }
  .reva-ui-unit {
    font-size: 0.78em;
    font-weight: 600;
    color: var(--secondary);
    margin-bottom: 6px;
  }
  .reva-ui-svg { display: block; width: 100%; height: auto; overflow: visible; }
  .reva-ui-axis { stroke: var(--hr); stroke-width: 1; }
  .reva-ui-grid { stroke: var(--hr); stroke-width: 1; stroke-dasharray: 2 3; opacity: 0.6; }
  .reva-ui-axislabel { fill: var(--secondary); font-size: 10px; }
  .reva-ui-line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .reva-ui-dot { stroke: var(--bg); stroke-width: 1; }
  .reva-ui-ann-warn { stroke: #ff453a; fill: #ff453a; }
  .reva-ui-ann-info { stroke: var(--accent); fill: var(--accent); }
  .reva-ui-ann-good { stroke: #34c759; fill: #34c759; }
  .reva-ui-annlabel { font-size: 9px; font-weight: 700; }
  .reva-ui-annlabel.warn { fill: #ff453a; }
  .reva-ui-annlabel.info { fill: var(--accent); }
  .reva-ui-annlabel.good { fill: #177245; }
  @media (prefers-color-scheme: dark) {
    .reva-ui-annlabel.good { fill: #7ee0a3; }
    .reva-ui-chart { background: rgba(255, 255, 255, 0.04); }
  }
  .reva-ui-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 14px;
    margin-top: 8px;
    font-size: 0.8em;
    color: var(--secondary);
  }
  .reva-ui-legend-item { display: inline-flex; align-items: center; gap: 5px; }
  .reva-ui-legend-swatch { width: 12px; height: 3px; border-radius: 2px; display: inline-block; }
  .reva-ui-note { margin-top: 6px; font-size: 0.78em; color: var(--secondary); }
  .reva-ui-tooltip {
    position: fixed;
    z-index: 30;
    pointer-events: none;
    background: rgba(30, 30, 32, 0.94);
    color: #fff;
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 11px;
    line-height: 1.35;
    white-space: nowrap;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    opacity: 0;
    transition: opacity 0.08s;
  }
  .reva-ui-tooltip.show { opacity: 1; }
  .reva-ui-fallback {
    background: var(--code-bg);
    padding: 8px 10px;
    border-radius: 8px;
    overflow-x: auto;
    font-family: "SF Mono", ui-monospace, Menlo, monospace;
    font-size: 0.82em;
    white-space: pre-wrap;
    word-break: break-word;
    margin: 0;
  }

  /* 流式光标 */
  .body.streaming::after {
    content: "▌";
    color: var(--accent);
    animation: blink 1s step-start infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
  <div id="transcript"></div>
<script>
(function () {
  "use strict";
  var root = document.getElementById("transcript");

  function postCopy(id) {
    try {
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.copy) {
        window.webkit.messageHandlers.copy.postMessage(String(id));
      }
    } catch (e) {}
  }

  function isNearBottom() {
    var threshold = 80;
    return (window.innerHeight + window.scrollY) >= (document.body.scrollHeight - threshold);
  }

  function scrollToBottomIfNeeded(force) {
    if (force || isNearBottom()) {
      window.scrollTo({ top: document.body.scrollHeight, behavior: "auto" });
    }
  }

  // ===== GenUI: reva-ui line_chart (离线自绘 SVG) =====================
  // 设计:占位 div 由 Swift 注入(<div class="reva-ui-chart" data-reva-ui="<base64 JSON>">)。
  // 这里 base64 解码 → JSON.parse(try/catch)→ 构建 SVG 串 → 替换 div 内容。
  // 解析失败 / 非 line_chart → 降级成代码块(不白屏、不毁整条消息)。
  // SVG 用固定 viewBox 坐标系(不依赖容器测量)→ 无布局探测,CSS width:100% 缩放。
  var REVA_SVG_NS = "http://www.w3.org/2000/svg";
  var REVA_VW = 600;       // viewBox 宽
  var REVA_VH = 260;       // viewBox 高
  var REVA_PAD = { top: 14, right: 16, bottom: 34, left: 44 };
  var REVA_COLORS = ["#0a84ff", "#34c759", "#ff9f0a", "#bf5af2", "#ff453a", "#64d2ff"];

  function revaEscapeXML(s) {
    return String(s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function revaIsFiniteNum(v) { return typeof v === "number" && isFinite(v); }

  // 计算 y 轴范围:优先 y_hint(min/max 各自可缺),否则从所有非空点自动 + 内边距。
  function revaComputeYRange(series, yHint) {
    var lo = Infinity, hi = -Infinity, i, j, pts, v;
    for (i = 0; i < series.length; i++) {
      pts = series[i].points || [];
      for (j = 0; j < pts.length; j++) {
        v = pts[j];
        if (revaIsFiniteNum(v)) { if (v < lo) lo = v; if (v > hi) hi = v; }
      }
    }
    if (!isFinite(lo) || !isFinite(hi)) { lo = 0; hi = 1; }
    if (lo === hi) { lo -= 1; hi += 1; }
    var pad = (hi - lo) * 0.08;
    var rMin = lo - pad, rMax = hi + pad;
    if (yHint && revaIsFiniteNum(yHint.min)) rMin = yHint.min;
    if (yHint && revaIsFiniteNum(yHint.max)) rMax = yHint.max;
    if (rMin === rMax) { rMax = rMin + 1; }
    return { min: rMin, max: rMax };
  }

  // 把一个 spec 对象构建成 SVG 字符串(纯函数,可在 node 里测)。
  // 返回 null 表示该 spec 不可渲染(交给调用方降级)。
  function buildRevaLineChartSVG(spec) {
    if (!spec || spec.component !== "line_chart") return null;
    var x = Array.isArray(spec.x) ? spec.x : [];
    var series = Array.isArray(spec.series) ? spec.series : [];
    if (x.length === 0 || series.length === 0) return null;

    var plotW = REVA_VW - REVA_PAD.left - REVA_PAD.right;
    var plotH = REVA_VH - REVA_PAD.top - REVA_PAD.bottom;
    var x0 = REVA_PAD.left, y0 = REVA_PAD.top;
    var n = x.length;
    function xAt(i) { return n <= 1 ? x0 + plotW / 2 : x0 + (plotW * i) / (n - 1); }
    var yr = revaComputeYRange(series, spec.y_hint);
    function yAt(v) { return y0 + plotH - ((v - yr.min) / (yr.max - yr.min)) * plotH; }

    var parts = [];
    // 网格 + y 轴刻度(4 等分)
    var ticks = 4, t, gy, gv;
    for (t = 0; t <= ticks; t++) {
      gv = yr.min + ((yr.max - yr.min) * t) / ticks;
      gy = yAt(gv);
      parts.push('<line class="reva-ui-grid" x1="' + x0 + '" y1="' + gy.toFixed(1) +
        '" x2="' + (x0 + plotW) + '" y2="' + gy.toFixed(1) + '"/>');
      parts.push('<text class="reva-ui-axislabel" x="' + (x0 - 6) + '" y="' + (gy + 3).toFixed(1) +
        '" text-anchor="end">' + revaEscapeXML(revaFmtNum(gv)) + '</text>');
    }
    // 轴线
    parts.push('<line class="reva-ui-axis" x1="' + x0 + '" y1="' + y0 + '" x2="' + x0 + '" y2="' + (y0 + plotH) + '"/>');
    parts.push('<line class="reva-ui-axis" x1="' + x0 + '" y1="' + (y0 + plotH) + '" x2="' + (x0 + plotW) + '" y2="' + (y0 + plotH) + '"/>');

    // x 轴标签(过密则抽稀,目标 <= 8 个)
    var maxLabels = 8;
    var step = Math.max(1, Math.ceil(n / maxLabels));
    var i, k;
    for (i = 0; i < n; i += step) {
      parts.push('<text class="reva-ui-axislabel" x="' + xAt(i).toFixed(1) + '" y="' + (y0 + plotH + 14) +
        '" text-anchor="middle">' + revaEscapeXML(x[i]) + '</text>');
    }

    // 折线 + 点(null 断开)
    for (k = 0; k < series.length; k++) {
      var color = REVA_COLORS[k % REVA_COLORS.length];
      var pts = series[k].points || [];
      var d = "", penDown = false, val, px, py;
      for (i = 0; i < n; i++) {
        val = pts[i];
        if (revaIsFiniteNum(val)) {
          px = xAt(i); py = yAt(val);
          d += (penDown ? " L " : " M ") + px.toFixed(1) + " " + py.toFixed(1);
          penDown = true;
        } else {
          penDown = false; // gap
        }
      }
      if (d) {
        parts.push('<path class="reva-ui-line" d="' + d.trim() + '" stroke="' + color + '"/>');
      }
      for (i = 0; i < n; i++) {
        val = pts[i];
        if (!revaIsFiniteNum(val)) continue;
        px = xAt(i); py = yAt(val);
        var tip = (series[k].name ? series[k].name + " · " : "") + x[i] + ": " +
          revaFmtNum(val) + (spec.unit ? " " + spec.unit : "");
        parts.push('<circle class="reva-ui-dot" cx="' + px.toFixed(1) + '" cy="' + py.toFixed(1) +
          '" r="3" fill="' + color + '" data-tip="' + revaEscapeXML(tip) + '"/>');
      }
    }

    // 注解(竖标记 + 标签),按 x 文本匹配索引
    var anns = Array.isArray(spec.annotations) ? spec.annotations : [];
    for (i = 0; i < anns.length; i++) {
      var a = anns[i];
      var idx = x.indexOf(a.x);
      if (idx < 0) continue;
      var kind = (a.kind === "warn" || a.kind === "good") ? a.kind : "info";
      var ax = xAt(idx);
      parts.push('<line class="reva-ui-ann-' + kind + '" x1="' + ax.toFixed(1) + '" y1="' + y0 +
        '" x2="' + ax.toFixed(1) + '" y2="' + (y0 + plotH) + '" stroke-width="1" stroke-dasharray="3 3"/>');
      parts.push('<circle class="reva-ui-ann-' + kind + '" cx="' + ax.toFixed(1) + '" cy="' + (y0 + 4) + '" r="3"/>');
      if (a.label) {
        var anchor = idx > n / 2 ? "end" : "start";
        var lx = idx > n / 2 ? ax - 4 : ax + 4;
        parts.push('<text class="reva-ui-annlabel ' + kind + '" x="' + lx.toFixed(1) + '" y="' + (y0 + 12) +
          '" text-anchor="' + anchor + '">' + revaEscapeXML(a.label) + '</text>');
      }
    }

    return '<svg class="reva-ui-svg" viewBox="0 0 ' + REVA_VW + ' ' + REVA_VH +
      '" preserveAspectRatio="xMidYMid meet" role="img">' + parts.join("") + '</svg>';
  }

  function revaFmtNum(v) {
    if (!revaIsFiniteNum(v)) return "";
    if (Math.abs(v) >= 100 || Number.isInteger(v)) return String(Math.round(v));
    return (Math.round(v * 10) / 10).toString();
  }

  // 单例 tooltip(fixed 定位,鼠标在点上时显示)。
  var revaTooltip = null;
  function revaGetTooltip() {
    if (revaTooltip) return revaTooltip;
    revaTooltip = document.createElement("div");
    revaTooltip.className = "reva-ui-tooltip";
    document.body.appendChild(revaTooltip);
    return revaTooltip;
  }

  // 把一个占位 div 渲染成图表(或降级)。幂等:已渲染过的跳过。
  function renderRevaChartEl(el) {
    if (!el || el.getAttribute("data-reva-done") === "1") return;
    el.setAttribute("data-reva-done", "1");
    var b64 = el.getAttribute("data-reva-ui") || "";
    var spec = null;
    try {
      var json = decodeURIComponent(escape(window.atob(b64)));
      spec = JSON.parse(json);
    } catch (e) { spec = null; }

    var svg = null;
    try { svg = buildRevaLineChartSVG(spec); } catch (e2) { svg = null; }

    if (!svg) {
      // 降级:把原始 JSON 当代码块展示(解析失败也不毁消息)。
      var raw = "";
      try { raw = decodeURIComponent(escape(window.atob(b64))); } catch (e3) { raw = ""; }
      el.classList.remove("rendered");
      el.innerHTML = '<pre class="reva-ui-fallback"></pre>';
      el.querySelector(".reva-ui-fallback").textContent = raw || "(图表数据无法解析)";
      return;
    }

    el.classList.add("rendered");
    var html = "";
    if (spec.title) html += '<div class="reva-ui-title">' + revaEscapeXML(spec.title) + '</div>';
    if (spec.unit) html += '<div class="reva-ui-unit">单位: ' + revaEscapeXML(spec.unit) + '</div>';
    html += svg;
    // 多序列图例
    var series = Array.isArray(spec.series) ? spec.series : [];
    if (series.length > 1) {
      var leg = '<div class="reva-ui-legend">';
      for (var s = 0; s < series.length; s++) {
        var c = REVA_COLORS[s % REVA_COLORS.length];
        leg += '<span class="reva-ui-legend-item"><span class="reva-ui-legend-swatch" style="background:' +
          c + '"></span>' + revaEscapeXML(series[s].name || ("序列 " + (s + 1))) + '</span>';
      }
      leg += '</div>';
      html += leg;
    }
    var note = [];
    if (spec.source) note.push("来源: " + spec.source);
    if (spec.data_note) note.push(spec.data_note);
    if (note.length) html += '<div class="reva-ui-note">' + revaEscapeXML(note.join(" · ")) + '</div>';
    el.innerHTML = html;

    // hover tooltip(桌面 WebView)
    var dots = el.querySelectorAll(".reva-ui-dot");
    for (var di = 0; di < dots.length; di++) {
      var dot = dots[di];
      dot.addEventListener("mouseover", function (ev) {
        var tt = revaGetTooltip();
        tt.textContent = ev.target.getAttribute("data-tip") || "";
        tt.classList.add("show");
      });
      dot.addEventListener("mousemove", function (ev) {
        var tt = revaGetTooltip();
        tt.style.left = (ev.clientX + 12) + "px";
        tt.style.top = (ev.clientY - 28) + "px";
      });
      dot.addEventListener("mouseout", function () {
        var tt = revaGetTooltip();
        tt.classList.remove("show");
      });
    }
  }

  // 在一个 body 子树里渲染所有 reva-ui 占位。
  function renderRevaCharts(scope) {
    if (!scope || !scope.querySelectorAll) return;
    var els = scope.querySelectorAll(".reva-ui-chart");
    for (var i = 0; i < els.length; i++) { renderRevaChartEl(els[i]); }
  }
  // 暴露供 headless(node)与调试使用。
  window.buildRevaLineChartSVG = buildRevaLineChartSVG;
  window.renderRevaCharts = renderRevaCharts;
  // ===================================================================

  function makeRow(msg) {
    var row = document.createElement("div");
    row.className = "row " + (msg.role === "user" ? "user" : "assistant");
    row.setAttribute("data-id", msg.id);

    var bubble = document.createElement("div");
    bubble.className = "bubble";

    if (msg.role === "assistant") {
      var meta = document.createElement("div");
      meta.className = "meta";
      var label = document.createElement("span");
      label.textContent = "Assistant";
      meta.appendChild(label);
      if (msg.copy) {
        var btn = document.createElement("button");
        btn.className = "copy-btn";
        btn.textContent = "Copy";
        btn.addEventListener("click", function () {
          postCopy(msg.id);
          btn.classList.add("copied");
          btn.textContent = "Copied";
          setTimeout(function () {
            btn.classList.remove("copied");
            btn.textContent = "Copy";
          }, 1500);
        });
        meta.appendChild(btn);
      }
      bubble.appendChild(meta);
    }

    var body = document.createElement("div");
    body.className = "body" + (msg.streaming ? " streaming" : "");
    body.innerHTML = msg.html;
    // GenUI:把消息体里的 reva-ui 占位渲染成 SVG 折线图。流式态下 Swift 侧用 plain 文本、
    // 不产占位 → 这里自然 no-op,直到消息结算才有占位、才绘图(契约 §3.3 流式安全)。
    renderRevaCharts(body);
    bubble.appendChild(body);

    // meta footer(模型/数据源/Skill)— 仅助手、非流式、且有内容时由 Swift 侧给出。
    // footer 已是 Swift 端 escape 后的受控 HTML 片段;空字符串则不渲染。
    if (msg.role === "assistant" && msg.footer) {
      var footer = document.createElement("div");
      footer.className = "footer-wrap";
      footer.innerHTML = msg.footer;
      bubble.appendChild(footer);
    }

    row.appendChild(bubble);
    return row;
  }

  function findRow(id) {
    return root.querySelector('.row[data-id="' + (window.CSS && CSS.escape ? CSS.escape(id) : id) + '"]');
  }

  window.chat = {
    // 全量替换(切换会话 / 历史加载)。messages: 数组,字段见 RenderedMessage。
    setMessages: function (messages) {
      root.innerHTML = "";
      for (var i = 0; i < messages.length; i++) {
        root.appendChild(makeRow(messages[i]));
      }
      scrollToBottomIfNeeded(true);
    },
    // 追加新消息或更新最后一条(流式 token 合批喂入)。
    appendOrUpdateLast: function (msg) {
      var existing = findRow(msg.id);
      if (existing) {
        var newRow = makeRow(msg);
        existing.replaceWith(newRow);
      } else {
        root.appendChild(makeRow(msg));
      }
      scrollToBottomIfNeeded(false);
    },
    setFontScale: function (scale) {
      document.documentElement.style.setProperty("--font-scale", String(scale));
    }
  };

  // 通知 Swift 端 JS 就绪(此时可安全 evaluateJavaScript 喂消息)。
  try {
    if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.ready) {
      window.webkit.messageHandlers.ready.postMessage("ready");
    }
  } catch (e) {}
})();
</script>
</body>
</html>
