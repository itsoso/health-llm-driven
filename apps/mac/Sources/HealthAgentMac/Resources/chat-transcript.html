<!DOCTYPE html>
<!--
  Chat transcript shell for the WKWebView-backed assistant conversation.
  纯本地、零网络:无 <script src>、无 <link href>、无字体 CDN。所有 CSS/JS 内联。
  消息 HTML 由 Swift 侧 ChatTranscriptHTML 预转义后注入,JS 仅做 DOM append/scroll/copy 桥接。
-->
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --font-scale: 1;
    --base-size: 14px;
    --bubble-radius: 14px;
    --gap: 14px;

    /* ── Warm "Claude Design" palette (light) ──────────────────────────────
       Same tokens as the web frontend + the SwiftUI WarmPalette. The chat
       WebView is transparent (drawsBackground=false) so bubbles sit on the
       warm-paper SwiftUI backdrop; the assistant bubble is a readable warm
       card + hairline + subtle shadow (was near-invisible gray), the user
       bubble is clay-soft with clay ink (was system blue). */
    --bg: transparent;
    --user-bubble: rgba(201, 100, 66, 0.12);
    --user-border: rgba(201, 100, 66, 0.26);
    --user-text: #A24F31;
    --assistant-bubble: #FCFBF7;
    --assistant-border: #E5E1D5;
    --assistant-shadow: rgba(41, 38, 31, 0.06);
    --text: #29261F;
    --secondary: #6B665A;
    --accent: #C96442;
    --code-bg: #F5F2E9;
    --table-border: #D8D3C4;
    --hr: #E5E1D5;

    /* latency waterfall band colors (pre-LLM 暖灰 / TTFT 琥珀 / 生成 鼠尾草 / 工具 珊瑚 / 分析 深珊瑚) */
    --wf-prellm: #B8B2A2;
    --wf-ttft: #B8791F;
    --wf-gen: #5F7A55;
    --wf-tool: #C96442;
    --wf-orch: #C0453B;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      /* Warm dark — warm near-black paper, warm card, warm off-white ink,
         clay brightened as accent. Not the system cool gray. */
      --user-bubble: rgba(217, 120, 79, 0.20);
      --user-border: rgba(217, 120, 79, 0.40);
      --user-text: #E29273;
      --assistant-bubble: #26221A;
      --assistant-border: #3A352B;
      --assistant-shadow: rgba(0, 0, 0, 0.28);
      --text: #F0EBE0;
      --secondary: #B8B2A2;
      --accent: #D9784F;
      --code-bg: #2C2820;
      --table-border: #47412F;
      --hr: #3A352B;

      --wf-prellm: #8A8574;
      --wf-ttft: #D9A04A;
      --wf-gen: #8FA982;
      --wf-tool: #D9784F;
      --wf-orch: #E07A6E;
    }
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif;
    font-size: calc(var(--base-size) * var(--font-scale));
    -webkit-font-smoothing: antialiased;
    -webkit-user-select: text;
    user-select: text;
  }
  #transcript {
    display: flex;
    flex-direction: column;
    gap: var(--gap);
    padding: 8px 4px 16px 4px;
    max-width: 860px;
    margin: 0 auto;
  }
  .row { display: flex; position: relative; }
  .row.user { justify-content: flex-end; }
  .row.assistant { justify-content: flex-start; }
  .message-time-divider {
    display: flex;
    justify-content: center;
    margin: 2px 0 2px;
    pointer-events: none;
  }
  .message-time-divider span {
    font-family: "SF Mono", ui-monospace, Menlo, monospace;
    font-size: 0.74em;
    font-weight: 650;
    color: var(--secondary);
    background: var(--assistant-bubble);
    border: 1px solid var(--assistant-border);
    border-radius: 999px;
    padding: 2px 9px;
    box-shadow: 0 1px 3px var(--assistant-shadow);
  }

  .bubble {
    border-radius: var(--bubble-radius);
    padding: 12px 14px;
    border: 1px solid transparent;
    line-height: 1.55;
    overflow-wrap: anywhere;
    word-break: break-word;
  }
  .row.user .bubble {
    background: var(--user-bubble);
    border-color: var(--user-border);
    color: var(--user-text);
    max-width: 620px;
    border-bottom-right-radius: 5px;
  }
  .row.assistant .bubble {
    background: var(--assistant-bubble);
    border-color: var(--assistant-border);
    box-shadow: 0 1px 2px var(--assistant-shadow);
    max-width: 100%;
    width: 100%;
    border-bottom-left-radius: 5px;
  }

  .meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family: "Songti SC", "Noto Serif SC", "Iowan Old Style", Georgia, serif;
    font-size: 0.86em;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 6px;
  }
  .meta-left {
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .message-time {
    position: absolute;
    top: -14px;
    font-family: "SF Mono", ui-monospace, Menlo, monospace;
    font-size: 0.78em;
    font-weight: 600;
    color: var(--secondary);
    opacity: 0;
    transition: opacity 0.16s ease;
    white-space: nowrap;
    pointer-events: none;
    padding: 1px 7px;
    border-radius: 999px;
    background: var(--assistant-bubble);
    border: 1px solid var(--assistant-border);
    box-shadow: 0 1px 4px var(--assistant-shadow);
  }
  .row:hover .message-time { opacity: 0.72; }
  .row.user .message-time {
    right: 4px;
  }
  .row.assistant .message-time {
    left: 42px;
  }
  .copy-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
    cursor: pointer;
    border: none;
    background: transparent;
    color: var(--secondary);
    padding: 0;
    border-radius: 6px;
  }
  .copy-btn:hover { background: var(--code-bg); color: var(--accent); }
  .copy-btn.copied { background: #E4EDDD; color: #5F7A55; }
  .copy-btn-icon {
    width: 15px;
    height: 15px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .body > *:first-child { margin-top: 0; }
  .body > *:last-child { margin-bottom: 0; }
  .body p { margin: 0.5em 0; }
  /* Serif display headings (Claude Design), warm ink. */
  .body h1, .body h2, .body h3, .body h4 {
    font-family: "Songti SC", "Noto Serif SC", "Iowan Old Style", Georgia, serif;
    color: var(--text);
  }
  .body h1, .body h2 { font-size: 1.2em; font-weight: 600; margin: 0.7em 0 0.4em; }
  .body h3, .body h4 { font-size: 1.06em; font-weight: 600; margin: 0.6em 0 0.3em; }
  .body b, .body strong { color: var(--user-text); }
  .body table { font-variant-numeric: tabular-nums; }
  .body ul, .body ol { margin: 0.4em 0; padding-left: 1.4em; }
  .body li { margin: 0.2em 0; }
  .body code {
    background: var(--code-bg);
    padding: 0.1em 0.35em;
    border-radius: 5px;
    font-family: "SF Mono", ui-monospace, Menlo, monospace;
    font-size: 0.9em;
  }
  .body hr { border: none; border-top: 1px solid var(--hr); margin: 0.8em 0; }
  .body table {
    border-collapse: collapse;
    margin: 0.6em 0;
    width: 100%;
    font-size: 0.95em;
  }
  .body th, .body td {
    border: 1px solid var(--table-border);
    padding: 5px 9px;
    text-align: left;
    vertical-align: top;
  }
  .body th { font-weight: 600; background: var(--code-bg); }
  .body .streaming-text { white-space: pre-wrap; }
  .attachment-images {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(92px, 140px));
    gap: 8px;
    margin-top: 8px;
  }
  .attachment-image-link {
    display: block;
    overflow: hidden;
    border-radius: 10px;
    border: 1px solid var(--table-border);
    background: var(--code-bg);
  }
  .attachment-image {
    display: block;
    width: 100%;
    max-height: 180px;
    object-fit: cover;
  }

  .dynamic-card {
    margin: 2px 0 10px;
    padding: 12px;
    border-radius: 12px;
    border: 1px solid rgba(95, 122, 85, 0.28);
    background: linear-gradient(180deg, rgba(95, 122, 85, 0.12), rgba(95, 122, 85, 0.045));
  }
  .dynamic-card + p,
  .dynamic-card + div.streaming-text {
    margin-top: 10px;
  }
  .dynamic-card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 10px;
  }
  .dynamic-card-eyebrow {
    font-size: 0.76em;
    font-weight: 700;
    color: var(--secondary);
    margin-bottom: 2px;
  }
  .dynamic-card-title {
    font-size: 1.06em;
    font-weight: 800;
    color: var(--text);
    letter-spacing: 0;
  }
  .dynamic-card-badge {
    flex: 0 0 auto;
    padding: 3px 8px;
    border-radius: 999px;
    font-size: 0.78em;
    font-weight: 800;
    border: 1px solid transparent;
  }
  .dynamic-card-badge.risk {
    color: #A6382C;
    background: rgba(192, 69, 59, 0.14);
    border-color: rgba(192, 69, 59, 0.24);
  }
  .dynamic-card-badge.neutral {
    color: #4B6242;
    background: rgba(95, 122, 85, 0.16);
    border-color: rgba(95, 122, 85, 0.26);
  }
  .dynamic-card-badge.caution {
    color: #8A5A12;
    background: rgba(184, 121, 31, 0.16);
    border-color: rgba(184, 121, 31, 0.26);
  }
  .dynamic-card-metrics {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(92px, 1fr));
    gap: 8px;
  }
  .dynamic-card-metric {
    min-width: 0;
    padding: 7px 8px;
    border-radius: 8px;
    border: 1px solid var(--hr);
    background: var(--code-bg);
    font-variant-numeric: tabular-nums;
    /* Column layout + consistent min-height so a stacked (label/value/sub) tile
       and the single-value tiles line up on the same row baseline. */
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    min-height: 42px;
  }
  .dynamic-card-metric-label {
    font-size: 0.72em;
    font-weight: 700;
    color: var(--secondary);
  }
  .dynamic-card-metric-value {
    margin-top: 2px;
    font-size: 0.9em;
    font-weight: 800;
    color: var(--text);
    /* Compound values are split into a nowrap primary + a sub-line, so the
       primary never wraps mid-token inside the ~92px tile. */
    white-space: nowrap;
  }
  .dynamic-card-metric-value.risk {
    color: #A6382C;
  }
  /* Secondary sub-line under a compound metric value (e.g. 今日蛋白 "还差81g"). */
  .dynamic-card-metric-sub {
    margin-top: 1px;
    font-size: 0.72em;
    font-weight: 600;
    color: var(--secondary);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .dynamic-card-detail,
  .dynamic-card-conclusion,
  .dynamic-card-next,
  .dynamic-card-warning {
    margin-top: 8px;
    font-size: 0.88em;
  }
  .dynamic-card-detail,
  .dynamic-card-next {
    color: var(--secondary);
  }
  .dynamic-card-conclusion {
    color: var(--text);
    font-weight: 650;
  }
  .dynamic-card-warning {
    padding: 7px 8px;
    border-radius: 8px;
    color: #8A5A12;
    background: rgba(184, 121, 31, 0.14);
    border: 1px solid rgba(184, 121, 31, 0.26);
  }
  .dynamic-card-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 10px;
  }
  /* A server reply may contain several atomic capabilities. This is a layout
     stack, not another visual card, so each capability keeps its own boundary. */
  .dynamic-card-group {
    display: grid;
    gap: 10px;
  }
  .dynamic-card-action {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 28px;
    padding: 5px 10px;
    border-radius: 999px;
    border: 1px solid rgba(95, 122, 85, 0.26);
    color: var(--text);
    background: var(--code-bg);
    font-size: 0.82em;
    font-weight: 800;
    text-decoration: none;
  }
  .dynamic-card-action.primary {
    color: white;
    background: #5F7A55;
    border-color: #5F7A55;
  }
  .dynamic-card-action.secondary {
    color: #4B6242;
  }
  .aigc-media-result {
    display: block;
    margin-top: 10px;
    overflow: hidden;
    border-radius: 10px;
    border: 1px solid rgba(95, 122, 85, 0.20);
  }
  .aigc-media-image {
    display: block;
    width: 100%;
    max-height: 360px;
    object-fit: cover;
    background: var(--code-bg);
  }
  .diet-draft-photo {
    display: block;
    width: 100%;
    max-height: 260px;
    margin: 10px 0;
    object-fit: cover;
    border-radius: 10px;
    border: 1px solid rgba(95, 122, 85, 0.20);
    background: var(--code-bg);
  }
  .evidence-card,
  .generic-card {
    border-color: rgba(201, 100, 66, 0.22);
    background: linear-gradient(180deg, rgba(201, 100, 66, 0.10), rgba(201, 100, 66, 0.04));
  }
  .safety-card-risk {
    border-color: rgba(192, 69, 59, 0.26);
    background: linear-gradient(180deg, rgba(192, 69, 59, 0.12), rgba(192, 69, 59, 0.045));
  }
  .safety-card-caution {
    border-color: rgba(184, 121, 31, 0.26);
    background: linear-gradient(180deg, rgba(184, 121, 31, 0.14), rgba(184, 121, 31, 0.05));
  }
  .safety-card-info {
    border-color: rgba(201, 100, 66, 0.20);
    background: linear-gradient(180deg, rgba(201, 100, 66, 0.09), rgba(201, 100, 66, 0.035));
  }
  .safety-card-summary {
    color: var(--text);
    font-weight: 700;
    line-height: 1.5;
  }
  .safety-card-recommendations {
    display: grid;
    gap: 6px;
    margin: 9px 0 0;
    padding: 0;
    list-style: none;
  }
  .safety-card-recommendations li {
    margin: 0;
    padding: 6px 8px;
    border-radius: 8px;
    border: 1px solid var(--hr);
    background: var(--code-bg);
    color: var(--text);
    font-size: 0.86em;
  }
  .safety-card-attention {
    display: inline-block;
    margin-top: 9px;
    padding: 3px 8px;
    border-radius: 999px;
    color: #A6382C;
    background: rgba(192, 69, 59, 0.12);
    border: 1px solid rgba(192, 69, 59, 0.22);
    font-size: 0.78em;
    font-weight: 800;
  }
  .dynamic-card-summary {
    display: grid;
    gap: 6px;
  }
  .dynamic-card-summary-row {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    padding: 6px 0;
    border-top: 1px solid rgba(120, 120, 128, 0.16);
    color: var(--secondary);
    font-size: 0.86em;
  }
  .dynamic-card-summary-row strong {
    color: var(--text);
    font-weight: 700;
    text-align: right;
  }

  /* menu_share card — 结构化菜单卡(菜品表 + 营养 + 总计 + 买菜清单),暖色调。 */
  .menu-share-card {
    border-color: rgba(201, 100, 66, 0.24);
    background: linear-gradient(180deg, rgba(201, 100, 66, 0.10), rgba(201, 100, 66, 0.04));
  }
  .menu-share-reason {
    margin: 2px 0 10px;
    font-size: 0.9em;
    color: var(--secondary);
    line-height: 1.5;
  }
  .menu-share-items {
    border-collapse: collapse;
    width: 100%;
    margin: 2px 0 4px;
    font-size: 0.9em;
    font-variant-numeric: tabular-nums;
  }
  .menu-share-items th,
  .menu-share-items td {
    border-bottom: 1px solid var(--hr);
    padding: 6px 8px;
    text-align: left;
    vertical-align: top;
  }
  .menu-share-items th {
    font-size: 0.78em;
    font-weight: 700;
    color: var(--secondary);
    background: transparent;
  }
  .menu-share-items tr:last-child td { border-bottom: none; }
  .menu-share-dish { font-weight: 700; color: var(--text); }
  .menu-share-qty { color: var(--secondary); white-space: nowrap; }
  .menu-share-nutrient { color: var(--secondary); font-size: 0.92em; }
  .menu-share-totals {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 10px;
    padding: 8px;
    border-radius: 8px;
    border: 1px solid var(--hr);
    background: var(--code-bg);
  }
  .menu-share-total {
    display: flex;
    flex-direction: column;
    min-width: 56px;
    font-variant-numeric: tabular-nums;
  }
  .menu-share-total-label {
    font-size: 0.72em;
    font-weight: 700;
    color: var(--secondary);
  }
  .menu-share-total-value {
    margin-top: 2px;
    font-size: 0.92em;
    font-weight: 800;
    color: var(--text);
    white-space: nowrap;
  }
  .menu-share-shopping { margin-top: 10px; }
  .menu-share-shopping-label {
    font-size: 0.76em;
    font-weight: 700;
    color: var(--secondary);
    margin-bottom: 6px;
  }
  .menu-share-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .menu-share-chip {
    display: inline-block;
    padding: 3px 9px;
    border-radius: 999px;
    border: 1px solid rgba(201, 100, 66, 0.24);
    background: rgba(201, 100, 66, 0.08);
    color: var(--text);
    font-size: 0.82em;
    font-weight: 600;
  }
  @media (prefers-color-scheme: dark) {
    .menu-share-totals {
      background: var(--code-bg);
      border-color: var(--hr);
    }
    .menu-share-chip {
      border-color: rgba(217, 120, 79, 0.30);
      background: rgba(217, 120, 79, 0.14);
    }
  }
  @media (prefers-color-scheme: dark) {
    .dynamic-card-metric {
      background: var(--code-bg);
      border-color: var(--hr);
    }
    .dynamic-card-badge.risk,
    .dynamic-card-metric-value.risk {
      color: #E8998C;
    }
    .dynamic-card-badge.neutral {
      color: #9CBB8E;
    }
    .dynamic-card-badge.caution {
      color: #E4B872;
    }
    .safety-card-recommendations li {
      background: var(--code-bg);
      border-color: var(--hr);
    }
    .dynamic-card-action {
      background: var(--code-bg);
      border-color: var(--hr);
    }
    .dynamic-card-action.secondary {
      color: #9CBB8E;
    }
    .safety-card-attention {
      color: #E8998C;
      background: rgba(224, 122, 110, 0.12);
      border-color: rgba(224, 122, 110, 0.20);
    }
    .dynamic-card-warning {
      color: #E4B872;
      background: rgba(217, 160, 74, 0.12);
      border-color: rgba(217, 160, 74, 0.20);
    }
  }

  /* meta footer (模型 · 轮数 · 耗时 / 数据源 / Skill) — 低调灰、小字号,不喧宾夺主 */
  .meta-footer {
    margin-top: 8px;
    padding-top: 6px;
    border-top: 1px solid var(--hr);
    display: flex;
    flex-direction: column;
    gap: 5px;
    font-size: 0.78em;
    color: var(--secondary);
  }
  .meta-footer .meta-line { color: var(--secondary); }
  .meta-footer details.meta-sources { color: var(--secondary); }
  .meta-footer details.meta-sources > summary {
    cursor: pointer;
    list-style: none;
    color: var(--secondary);
    user-select: none;
  }
  .meta-footer details.meta-sources > summary::-webkit-details-marker { display: none; }
  .meta-footer details.meta-sources > summary::before {
    content: "▸ ";
    color: var(--secondary);
  }
  .meta-footer details.meta-sources[open] > summary::before { content: "▾ "; }
  .meta-footer details.meta-sources ul {
    margin: 4px 0 0;
    padding-left: 1.2em;
  }
  .meta-footer details.meta-sources li { margin: 1px 0; }
  .meta-footer .meta-tools {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 5px;
  }
  .meta-footer .meta-tools-label { color: var(--secondary); }
  .meta-footer .meta-chip {
    display: inline-block;
    padding: 1px 7px;
    border-radius: 10px;
    border: 1px solid var(--assistant-border);
    background: var(--code-bg);
    color: var(--secondary);
    font-size: 0.95em;
  }

  /* 思考过程 trace:可折叠披露(思考过程 header + 逐步骤)。低调、暖调,不喧宾夺主。
     header 用纯 chevron(▸/▾),无 brain/emoji;步骤 glyph 用线性点/勾。确定性布局:
     固定宽度 leading gutter(.tp-gutter),不做宽度协商。live 态最后一步是 spinner。 */
  .thinking-trace {
    margin: 0 0 8px;
    font-size: 0.8em;
    color: var(--secondary);
    border-left: 2px solid var(--assistant-border);
    padding-left: 10px;
  }
  .thinking-trace > summary.tp-summary {
    cursor: pointer;
    list-style: none;
    user-select: none;
    color: var(--secondary);
    letter-spacing: 0.02em;
  }
  .thinking-trace > summary.tp-summary::-webkit-details-marker { display: none; }
  .thinking-trace > summary.tp-summary::before {
    content: "\25B8  "; /* ▸ */
    color: var(--secondary);
    opacity: 0.7;
  }
  .thinking-trace[open] > summary.tp-summary::before { content: "\25BE  "; } /* ▾ */
  .thinking-trace .tp-steps {
    list-style: none;
    margin: 6px 0 2px;
    padding: 0;

  .thinking-trace .tp-gutter {

  .thinking-trace .tp-check {

  .thinking-trace .tp-check::before {
    content: "";
    width: 5px;
    height: 9px;
    border: solid var(--accent);
    border-width: 0 1.5px 1.5px 0;

    margin-top: -2px;
    opacity: 0.75;

  .thinking-trace .tp-spinner::before {

  /* 延迟瀑布图:紧凑色带 + 可折叠明细(tap 展开逐阶段/逐轮耗时) */

  /* GenUI reva-ui 折线图 / 空状态(JS 自绘,离线;占位 div 由 Swift 注入) */

  /* GenUI reva-ui metric_table(rank1):暖色调数据表卡片,与 dynamic-card 同族。

  /* 流式光标:仅在流式文本非空时,把闪烁的 caret 拼在已流出的文本尾部。
     防御:pre-first-token 的空气泡由 Swift 侧 renderedTranscript 直接不发出
     (ThinkingStatusLine 是唯一等待提示),这里再加一道 —— caret 只挂在

  <div id="transcript"></div>
<script>
(function () {
  "use strict";
  var root = document.getElementById("transcript");

  function postCopy(id) {
    try {
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.copy) {
        window.webkit.messageHandlers.copy.postMessage(String(id));
      }
    } catch (e) {}
  }

  function setCopyButtonState(button, copied) {
    button.classList.toggle("copied", copied);
    button.setAttribute("aria-label", copied ? "已复制" : "复制");
    button.setAttribute("title", copied ? "已复制" : "复制");
    button.innerHTML = copied
      ? '<svg class="copy-btn-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>'
      : '<svg class="copy-btn-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M15 9V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h3"/></svg>';
  }

  function postRouteOpen(route) {
    try {
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.routeOpen) {
        window.webkit.messageHandlers.routeOpen.postMessage(String(route));
      }
    } catch (e) {}
  }

  function postAIGCConfirm(confirmationID) {
    try {
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.aigcConfirm) {
        window.webkit.messageHandlers.aigcConfirm.postMessage(String(confirmationID));
      }
    } catch (e) {}
  }

  function postDietDraftConfirm(actionID) {
    try {
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.dietDraftConfirm) {
        window.webkit.messageHandlers.dietDraftConfirm.postMessage(String(actionID));
      }
    } catch (e) {}
  }

  function isSafeInternalRoute(route) {
    return typeof route === "string" && route.indexOf("/") === 0 && route.indexOf("//") !== 0 &&
      !/[\u0000-\u001f\u007f]/.test(route);
  }

  function bindDynamicCardActions(scope) {
    if (!scope || !scope.querySelectorAll) return;
    var actions = scope.querySelectorAll(".dynamic-card-action[href]");
    for (var i = 0; i < actions.length; i++) {
      actions[i].addEventListener("click", function (ev) {
        var route = ev.currentTarget.getAttribute("href") || "";
        if (route.indexOf("xiaoba-aigc-confirm://") === 0) {
          var confirmationID = route.substring("xiaoba-aigc-confirm://".length);
          if (confirmationID && /^[A-Za-z0-9_-]+$/.test(confirmationID)) {
            ev.preventDefault();
            postAIGCConfirm(confirmationID);
          }
          return;
        }
        if (route.indexOf("xiaoba-diet-confirm://") === 0) {
          var actionID = route.substring("xiaoba-diet-confirm://".length);
          if (actionID && /^[A-Za-z0-9_:-]+$/.test(actionID)) {
            ev.preventDefault();
            postDietDraftConfirm(actionID);
          }
          return;
        }
        if (!isSafeInternalRoute(route)) return;
        ev.preventDefault();
        postRouteOpen(route);
      });
    }
  }

  function isNearBottom() {
    var threshold = 80;
    return (window.innerHeight + window.scrollY) >= (document.body.scrollHeight - threshold);
  }

  function scrollToBottomIfNeeded(force) {
    if (force || isNearBottom()) {
      window.scrollTo({ top: document.body.scrollHeight, behavior: "auto" });
    }
  }

  var scrollSettleDelays = [0, 80, 220, 480, 900];
  var scrollSettleTimers = [];
  function clearScheduledBottomScrolls() {
    for (var i = 0; i < scrollSettleTimers.length; i++) {
      clearTimeout(scrollSettleTimers[i]);
    }
    scrollSettleTimers = [];
  }
  function scheduleScrollToBottom(force) {
    if (!force && !isNearBottom()) return;
    clearScheduledBottomScrolls();
    for (var i = 0; i < scrollSettleDelays.length; i++) {
      (function (delay) {
        scrollSettleTimers.push(setTimeout(function () {
          window.scrollTo({ top: document.body.scrollHeight, behavior: "auto" });
        }, delay));
      })(scrollSettleDelays[i]);
    }
  }

  // ===== GenUI: reva-ui line_chart / metric_line_chart / metric_empty_state =====================
  // 设计:占位 div 由 Swift 注入(<div class="reva-ui-chart" data-reva-ui="<base64 JSON>">)。
  // 这里 base64 解码 → JSON.parse(try/catch)→ 构建 SVG 串 → 替换 div 内容。
  // 解析失败 / 未支持组件 → 降级成代码块(不白屏、不毁整条消息)。
  // SVG 用固定 viewBox 坐标系(不依赖容器测量)→ 无布局探测,CSS width:100% 缩放。
  var REVA_SVG_NS = "http://www.w3.org/2000/svg";
  var REVA_VW = 600;       // viewBox 宽
  var REVA_VH = 260;       // viewBox 高
  var REVA_PAD = { top: 14, right: 16, bottom: 34, left: 44 };
  // Warm "Claude Design" chart series palette — sage / clay / amber, warm neutral,
  // clay-ink, sky-sage. Colors only; series-selection & draw logic untouched (R4:
  // chart numbers stay backend-deterministic, this is pure restyle).
  var REVA_COLORS = ["#5F7A55", "#C96442", "#B8791F", "#A24F31", "#8C7BB0", "#7FA6A0"];

  // 角色 → 固定调色板 + 线型(warm, dark-mode 双安全)。缺省/未知角色回退默认。
  // sage=7d hero,amber=30d,clay=Apple Watch device,暖灰=raw 噪声背景。
  var REVA_ROLE_STYLE = {
    raw:     { color: "#948F80", lineClass: "reva-ui-line-raw",    dots: false, dotR: 0   },
    avg_7d:  { color: "#5F7A55", lineClass: "reva-ui-line-avg7",   dots: false, dotR: 0   },
    avg_30d: { color: "#B8791F", lineClass: "reva-ui-line-avg30",  dots: false, dotR: 0   },
    device:  { color: "#C96442", lineClass: "reva-ui-line-device", dots: true,  dotR: 2.6 },
    value:   { color: null,      lineClass: "reva-ui-line",        dots: true,  dotR: 3   }
  };
  // 解析一个 series 的有效样式:role 命中表则用之(color 缺省回退调色板槽);否则走 value。
  function revaStyleForSeries(series, slotIndex) {
    var role = series && typeof series.role === "string" ? series.role : "value";
    var style = REVA_ROLE_STYLE[role] || REVA_ROLE_STYLE.value;
    var color = style.color || REVA_COLORS[slotIndex % REVA_COLORS.length];
    return { role: role, color: color, lineClass: style.lineClass, dots: style.dots, dotR: style.dotR };
  }

  // x 轴日期刻度格式化:"2026-06-30" → "06-30";"06-30" 原样;非日期串原样返回。
  function revaFmtDateTick(s) {
    if (typeof s !== "string") return String(s == null ? "" : s);
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
    if (m) return m[2] + "-" + m[3];
    return s;
  }

  function revaEscapeXML(s) {
    return String(s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function revaIsFiniteNum(v) { return typeof v === "number" && isFinite(v); }
  function revaIsChartComponent(spec) {
    return !!spec && (spec.component === "line_chart" || spec.component === "metric_line_chart");
  }
  function revaIsMetricEmptyState(spec) {
    return !!spec && spec.component === "metric_empty_state";
  }
  // rank1 metric_table:契约用 `type`(折线用 `component`)。也容忍 `component` 写法,
  // 防后端作者沿用折线的 key 造成静默降级。列/行齐备才算,缺则交回降级。
  function revaIsMetricTable(spec) {
    if (!spec) return false;
    if (spec.type !== "metric_table" && spec.component !== "metric_table") return false;
    return Array.isArray(spec.columns) && Array.isArray(spec.rows);
  }

  // 计算 y 轴范围:优先 y_hint(min/max 各自可缺),否则从所有非空点自动 + 内边距。
  function revaComputeYRange(series, yHint) {
    var lo = Infinity, hi = -Infinity, i, j, pts, v;
    for (i = 0; i < series.length; i++) {
      pts = series[i].points || [];
      for (j = 0; j < pts.length; j++) {
        v = pts[j];
        if (revaIsFiniteNum(v)) { if (v < lo) lo = v; if (v > hi) hi = v; }
      }

    if (!isFinite(lo) || !isFinite(hi)) { lo = 0; hi = 1; }
    if (lo === hi) { lo -= 1; hi += 1; }
    var pad = (hi - lo) * 0.08;
    var rMin = lo - pad, rMax = hi + pad;
    if (yHint && revaIsFiniteNum(yHint.min)) rMin = yHint.min;
    if (yHint && revaIsFiniteNum(yHint.max)) rMax = yHint.max;
    if (rMin === rMax) { rMax = rMin + 1; }
    return { min: rMin, max: rMax };
  }

  // 把一个 spec 对象构建成 SVG 字符串(纯函数,可在 node 里测)。
  // 返回 null 表示该 spec 不可渲染(交给调用方降级)。
  function buildRevaLineChartSVG(spec) {
    if (!revaIsChartComponent(spec)) return null;
    var x = Array.isArray(spec.x) ? spec.x : [];
    var series = Array.isArray(spec.series) ? spec.series : [];
    if (x.length === 0 || series.length === 0) return null;

    var plotW = REVA_VW - REVA_PAD.left - REVA_PAD.right;
    var plotH = REVA_VH - REVA_PAD.top - REVA_PAD.bottom;
    var x0 = REVA_PAD.left, y0 = REVA_PAD.top;
    var n = x.length;
    function xAt(i) { return n <= 1 ? x0 + plotW / 2 : x0 + (plotW * i) / (n - 1); }
    var yr = revaComputeYRange(series, spec.y_hint);
    function yAt(v) { return y0 + plotH - ((v - yr.min) / (yr.max - yr.min)) * plotH; }

    var parts = [];
    // 网格 + y 轴刻度(4 等分)
    var ticks = 4, t, gy, gv;
    for (t = 0; t <= ticks; t++) {
      gv = yr.min + ((yr.max - yr.min) * t) / ticks;
      gy = yAt(gv);
      parts.push('<line class="reva-ui-grid" x1="' + x0 + '" y1="' + gy.toFixed(1) +
        '" x2="' + (x0 + plotW) + '" y2="' + gy.toFixed(1) + '"/>');
      parts.push('<text class="reva-ui-axislabel" x="' + (x0 - 6) + '" y="' + (gy + 3).toFixed(1) +
        '" text-anchor="end">' + revaEscapeXML(revaFmtNum(gv)) + '</text>');
    }
    // 轴线
    parts.push('<line class="reva-ui-axis" x1="' + x0 + '" y1="' + y0 + '" x2="' + x0 + '" y2="' + (y0 + plotH) + '"/>');
    parts.push('<line class="reva-ui-axis" x1="' + x0 + '" y1="' + (y0 + plotH) + '" x2="' + (x0 + plotW) + '" y2="' + (y0 + plotH) + '"/>');

    // x 轴标签(过密则抽稀,目标 <= 8 个)
    var maxLabels = 8;
    var step = Math.max(1, Math.ceil(n / maxLabels));
    var i, k;
    for (i = 0; i < n; i += step) {
      parts.push('<text class="reva-ui-axislabel" x="' + xAt(i).toFixed(1) + '" y="' + (y0 + plotH + 14) +
        '" text-anchor="middle">' + revaEscapeXML(revaFmtDateTick(x[i])) + '</text>');
    }

    // 折线 + 点(null 断开)。角色决定线型/颜色/是否画点(raw/avg* 不画点,device/value 画点)。
    // 绘制顺序:先 raw(底噪),后 device,再 30d/7d/value——保证 hero 线压在最上。
    var drawOrder = [];
    for (k = 0; k < series.length; k++) { drawOrder.push(k); }
    var ROLE_Z = { raw: 0, device: 1, avg_30d: 2, value: 3, avg_7d: 4 };
    drawOrder.sort(function (a, b) {
      var za = ROLE_Z[(series[a] && series[a].role) || "value"]; if (za === undefined) za = 3;
      var zb = ROLE_Z[(series[b] && series[b].role) || "value"]; if (zb === undefined) zb = 3;
      return za - zb || a - b;
    });
    for (var oi = 0; oi < drawOrder.length; oi++) {
      k = drawOrder[oi];
      var st = revaStyleForSeries(series[k], k);
      var pts = series[k].points || [];
      var d = "", penDown = false, val, px, py;
      for (i = 0; i < n; i++) {
        val = pts[i];
        if (revaIsFiniteNum(val)) {
          px = xAt(i); py = yAt(val);
          d += (penDown ? " L " : " M ") + px.toFixed(1) + " " + py.toFixed(1);
          penDown = true;
        } else {
          penDown = false; // gap
        }
      }
      // device 角色以散点为主,但仍画一条很淡的连线辅助阅读;raw 画淡线不画点。
      if (d) {
        parts.push('<path class="reva-ui-line ' + st.lineClass + '" d="' + d.trim() +
          '" stroke="' + st.color + '"/>');
      }
      if (st.dots && st.dotR > 0) {
        for (i = 0; i < n; i++) {
          val = pts[i];
          if (!revaIsFiniteNum(val)) continue;
          px = xAt(i); py = yAt(val);
          var tip = (series[k].name ? series[k].name + " · " : "") + x[i] + ": " +
            revaFmtNum(val) + (spec.unit ? " " + spec.unit : "");
          parts.push('<circle class="reva-ui-dot" cx="' + px.toFixed(1) + '" cy="' + py.toFixed(1) +
            '" r="' + st.dotR + '" fill="' + st.color + '" data-tip="' + revaEscapeXML(tip) + '"/>');
        }
      }
    }

    // 注解。kind === "latest" → callout 框 + 引线指向最后一个非空点;其余(warn/info/good)沿用竖标记。
    var anns = Array.isArray(spec.annotations) ? spec.annotations : [];
    for (i = 0; i < anns.length; i++) {
      var a = anns[i];
      if (a && a.kind === "latest") {
        parts.push(revaBuildLatestCallout(a, spec, series, x, n, xAt, yAt, x0, y0, plotW, plotH));
        continue;
      }
      var idx = x.indexOf(a.x);
      if (idx < 0) continue;
      var kind = (a.kind === "warn" || a.kind === "good") ? a.kind : "info";
      var ax = xAt(idx);
      parts.push('<line class="reva-ui-ann-' + kind + '" x1="' + ax.toFixed(1) + '" y1="' + y0 +
        '" x2="' + ax.toFixed(1) + '" y2="' + (y0 + plotH) + '" stroke-width="1" stroke-dasharray="3 3"/>');
      parts.push('<circle class="reva-ui-ann-' + kind + '" cx="' + ax.toFixed(1) + '" cy="' + (y0 + 4) + '" r="3"/>');
      if (a.label) {
        var anchor = idx > n / 2 ? "end" : "start";
        var lx = idx > n / 2 ? ax - 4 : ax + 4;
        parts.push('<text class="reva-ui-annlabel ' + kind + '" x="' + lx.toFixed(1) + '" y="' + (y0 + 12) +
          '" text-anchor="' + anchor + '">' + revaEscapeXML(a.label) + '</text>');
      }
    }

    return '<svg class="reva-ui-svg" viewBox="0 0 ' + REVA_VW + ' ' + REVA_VH +
      '" preserveAspectRatio="xMidYMid meet" role="img">' + parts.join("") + '</svg>';
  }

  function buildRevaMetricEmptyStateHTML(spec) {
    if (!revaIsMetricEmptyState(spec)) return null;
    var html = "";
    html += '<div class="reva-ui-title">' + revaEscapeXML(spec.title || "数据不足") + '</div>';
    html += '<span class="reva-ui-empty-badge">待补齐</span>';
    html += '<div class="reva-ui-empty-message">' +
      revaEscapeXML(spec.message || "暂无足够数据生成趋势图。") + '</div>';
    var suggestions = Array.isArray(spec.suggestions) ? spec.suggestions : [];
    if (suggestions.length) {
      html += '<ul class="reva-ui-empty-list">';
      for (var i = 0; i < suggestions.length && i < 4; i++) {
        if (typeof suggestions[i] !== "string" || !suggestions[i]) continue;
        html += '<li>' + revaEscapeXML(suggestions[i]) + '</li>';
      }
      html += '</ul>';
    }
    if (spec.boundary) {
      html += '<div class="reva-ui-disclaimer">' + revaEscapeXML(spec.boundary) + '</div>';
    }
    return html;
  }

  // rank1 metric_table → 暖色调 <table> 卡片(纯字符串,可在 node 里测)。
  // 契约:{type:"metric_table", v, title≤20字, columns[{key,label}]×2-4, rows[{col-key:str}]×1-12, footnote?}
  // 防御:列裁到 ≤4、行裁到 ≤12;无有效列或零行 → 返回 null 交回降级(不画空表)。
  // 单元格一律 String() + revaEscapeXML(与折线/空态同一 XSS 防线);缺值渲染空串。
  function buildRevaMetricTableHTML(spec) {
    if (!revaIsMetricTable(spec)) return null;
    var cols = [];
    for (var i = 0; i < spec.columns.length && cols.length < 4; i++) {
      var c = spec.columns[i];
      if (!c || typeof c.key !== "string" || !c.key) continue;
      cols.push({ key: c.key, label: (typeof c.label === "string" && c.label) ? c.label : c.key });
    }
    if (cols.length === 0) return null;
    var rows = [];
    for (var r = 0; r < spec.rows.length && rows.length < 12; r++) {
      if (spec.rows[r] && typeof spec.rows[r] === "object") rows.push(spec.rows[r]);
    }
    if (rows.length === 0) return null;

    var html = '<div class="reva-ui-table-card">';
    if (spec.title) html += '<div class="reva-ui-table-title">' + revaEscapeXML(spec.title) + '</div>';
    html += '<div class="reva-ui-table-scroll"><table class="reva-ui-table"><thead><tr>';
    for (var h = 0; h < cols.length; h++) {
      html += '<th>' + revaEscapeXML(cols[h].label) + '</th>';
    }
    html += '</tr></thead><tbody>';
    for (var ri = 0; ri < rows.length; ri++) {
      html += '<tr>';
      for (var k = 0; k < cols.length; k++) {
        var cell = rows[ri][cols[k].key];
        var text = (cell === null || cell === undefined) ? "" : String(cell);
        // 首列 = 行标签(略强调),其余 = 数值(等宽 tabular-nums)。
        var cls = k === 0 ? "reva-ui-td-label" : "reva-ui-td-value";
        html += '<td class="' + cls + '">' + revaEscapeXML(text) + '</td>';
      }
      html += '</tr>';
    }
    html += '</tbody></table></div>';
    if (spec.footnote) html += '<div class="reva-ui-table-foot">' + revaEscapeXML(spec.footnote) + '</div>';
    html += '</div>';
    return html;
  }

  function revaFmtNum(v) {
    if (!revaIsFiniteNum(v)) return "";
    if (Math.abs(v) >= 100 || Number.isInteger(v)) return String(Math.round(v));
    return (Math.round(v * 10) / 10).toString();
  }

  // 找出 latest callout 的锚点(x 索引 + 值)。优先 annotation.x 命中,否则取 hero 序列
  // (avg_7d > value > 第一条有非空尾点的序列)的最后一个非空点。返回 null 表示无法定位。
  function revaFindLatestAnchor(ann, series, x, n) {
    // annotation 显式 x 命中时,在偏好序列里取该索引的值。
    var prefOrder = [], i, k;
    for (k = 0; k < series.length; k++) {
      var role = (series[k] && series[k].role) || "value";
      if (role === "avg_7d") prefOrder.unshift(k); else prefOrder.push(k);
    }
    var idx = (ann && typeof ann.x !== "undefined") ? x.indexOf(ann.x) : -1;
    if (idx >= 0) {
      for (i = 0; i < prefOrder.length; i++) {
        var v0 = (series[prefOrder[i]].points || [])[idx];
        if (revaIsFiniteNum(v0)) return { idx: idx, value: v0 };
      }
    }
    // 回退:跨偏好序列,找全局最靠右的非空点。
    var bestIdx = -1, bestVal = null;
    for (i = 0; i < prefOrder.length; i++) {
      var pts = series[prefOrder[i]].points || [];
      for (k = n - 1; k >= 0; k--) {
        if (revaIsFiniteNum(pts[k])) {
          if (k > bestIdx) { bestIdx = k; bestVal = pts[k]; }
          break;
        }
      }
    }
    if (bestIdx < 0) return null;
    return { idx: bestIdx, value: bestVal };
  }

  // 构建 latest callout SVG 片段:引线 + 圆点高亮 + 右上角(或就近)文本框 "最新 NN.N ms · label"。
  function revaBuildLatestCallout(ann, spec, series, x, n, xAt, yAt, x0, y0, plotW, plotH) {
    var anchor = revaFindLatestAnchor(ann, series, x, n);
    if (!anchor) return "";
    var px = xAt(anchor.idx), py = yAt(anchor.value);
    var unit = spec && spec.unit ? " " + spec.unit : "";
    var label = ann && ann.label ? String(ann.label) : revaFmtDateTick(x[anchor.idx]);
    var text = "最新 " + revaFmtNum(anchor.value) + unit + (label ? " · " + label : "");
    // 文本框尺寸估算(等宽近似:中文按 ~9px,其他按 ~5.5px),固定贴右上但夹在绘图区内。
    var charW = 0, ci;
    for (ci = 0; ci < text.length; ci++) {
      charW += text.charCodeAt(ci) > 255 ? 9 : 5.4;
    }
    var boxW = Math.min(plotW - 4, charW + 14);
    var boxH = 18;
    var boxX = x0 + plotW - boxW;          // 贴右
    var boxY = y0 + 2;                       // 贴顶
    // 若锚点就在右上角附近,把框左移以免遮点。
    if (px > boxX - 6 && py < boxY + boxH + 6) { boxX = Math.max(x0, px - boxW - 8); }
    var s = "";
    // 引线:从框底缘中点到锚点。
    var leaderX = boxX + boxW / 2, leaderY = boxY + boxH;
    s += '<line class="reva-ui-callout-leader" x1="' + leaderX.toFixed(1) + '" y1="' + leaderY.toFixed(1) +
      '" x2="' + px.toFixed(1) + '" y2="' + py.toFixed(1) + '"/>';
    // 锚点高亮圈。
    s += '<circle class="reva-ui-ann-info" cx="' + px.toFixed(1) + '" cy="' + py.toFixed(1) + '" r="3.5"/>';
    // 框 + 文本。
    s += '<rect class="reva-ui-callout-box" x="' + boxX.toFixed(1) + '" y="' + boxY.toFixed(1) +
      '" width="' + boxW.toFixed(1) + '" height="' + boxH + '" rx="5"/>';
    s += '<text class="reva-ui-callout-text" x="' + (boxX + boxW / 2).toFixed(1) + '" y="' + (boxY + 12).toFixed(1) +
      '" text-anchor="middle">' + revaEscapeXML(text) + '</text>';
    return s;
  }

  // 单例 tooltip(fixed 定位,鼠标在点上时显示)。
  var revaTooltip = null;
  function revaGetTooltip() {
    if (revaTooltip) return revaTooltip;
    revaTooltip = document.createElement("div");
    revaTooltip.className = "reva-ui-tooltip";
    document.body.appendChild(revaTooltip);
    return revaTooltip;
  }

  // 把一个占位 div 渲染成图表(或降级)。幂等:已渲染过的跳过。
  function renderRevaChartEl(el) {
    if (!el || el.getAttribute("data-reva-done") === "1") return;
    el.setAttribute("data-reva-done", "1");
    var b64 = el.getAttribute("data-reva-ui") || "";
    var spec = null;
    try {
      var json = decodeURIComponent(escape(window.atob(b64)));
      spec = JSON.parse(json);
    } catch (e) { spec = null; }

    var emptyHTML = null;
    try { emptyHTML = buildRevaMetricEmptyStateHTML(spec); } catch (e2) { emptyHTML = null; }
    if (emptyHTML) {
      el.classList.add("rendered");
      el.innerHTML = emptyHTML;
      return;
    }

    // rank1 metric_table(type-routed;与折线 component 不冲突)。
    var tableHTML = null;
    try { tableHTML = buildRevaMetricTableHTML(spec); } catch (e5) { tableHTML = null; }
    if (tableHTML) {
      el.classList.add("rendered");
      el.innerHTML = tableHTML;
      return;
    }

    var svg = null;
    try { svg = buildRevaLineChartSVG(spec); } catch (e4) { svg = null; }

    if (!svg) {
      // 降级:把原始 JSON 当代码块展示(解析失败也不毁消息)。
      var raw = "";
      try { raw = decodeURIComponent(escape(window.atob(b64))); } catch (e3) { raw = ""; }
      el.classList.remove("rendered");
      el.innerHTML = '<pre class="reva-ui-fallback"></pre>';
      el.querySelector(".reva-ui-fallback").textContent = raw || "(图表数据无法解析)";
      return;
    }

    el.classList.add("rendered");
    var html = "";
    if (spec.title) html += '<div class="reva-ui-title">' + revaEscapeXML(spec.title) + '</div>';
    if (spec.unit) html += '<div class="reva-ui-unit">单位: ' + revaEscapeXML(spec.unit) + '</div>';
    html += svg;
    // 多序列图例(角色感知:device/raw 用圆点 swatch,折线类用横条 swatch)。
    var series = Array.isArray(spec.series) ? spec.series : [];
    if (series.length > 1) {
      var leg = '<div class="reva-ui-legend">';
      for (var s = 0; s < series.length; s++) {
        var stl = revaStyleForSeries(series[s], s);
        var swatchClass = stl.dots && stl.dotR > 0 && (series[s].role === "device" || series[s].role === "raw")
          ? "reva-ui-legend-swatch dots" : "reva-ui-legend-swatch";
        leg += '<span class="reva-ui-legend-item"><span class="' + swatchClass + '" style="background:' +
          stl.color + '"></span>' + revaEscapeXML(series[s].name || ("序列 " + (s + 1))) + '</span>';
      }
      leg += '</div>';
      html += leg;
    }
    // source 仍走轻量 note;data_note / disclaimer 作为底部免责声明脚注(有任一即渲染)。
    if (spec.source) {
      html += '<div class="reva-ui-note">' + revaEscapeXML("来源: " + spec.source) + '</div>';
    }
    var foot = [];
    if (spec.data_note) foot.push(spec.data_note);
    if (spec.disclaimer) foot.push(spec.disclaimer);
    if (foot.length) {
      html += '<div class="reva-ui-disclaimer">' + revaEscapeXML(foot.join(" · ")) + '</div>';
    }
    el.innerHTML = html;

    // hover tooltip(桌面 WebView)
    var dots = el.querySelectorAll(".reva-ui-dot");
    for (var di = 0; di < dots.length; di++) {
      var dot = dots[di];
      dot.addEventListener("mouseover", function (ev) {
        var tt = revaGetTooltip();
        tt.textContent = ev.target.getAttribute("data-tip") || "";
        tt.classList.add("show");
      });
      dot.addEventListener("mousemove", function (ev) {
        var tt = revaGetTooltip();
        tt.style.left = (ev.clientX + 12) + "px";
        tt.style.top = (ev.clientY - 28) + "px";
      });
      dot.addEventListener("mouseout", function () {
        var tt = revaGetTooltip();
        tt.classList.remove("show");
      });
    }
  }

  // 在一个 body 子树里渲染所有 reva-ui 占位。
  function renderRevaCharts(scope) {
    if (!scope || !scope.querySelectorAll) return;
    var els = scope.querySelectorAll(".reva-ui-chart");
    for (var i = 0; i < els.length; i++) { renderRevaChartEl(els[i]); }
  }
  // 暴露供 headless(node)与调试使用。
  window.buildRevaLineChartSVG = buildRevaLineChartSVG;
  window.buildRevaMetricTableHTML = buildRevaMetricTableHTML;
  window.renderRevaCharts = renderRevaCharts;
  // ===================================================================

  function makeRow(msg) {
    var row = document.createElement("div");
    row.className = "row " + (msg.role === "user" ? "user" : "assistant");
    row.setAttribute("data-id", msg.id);
    if (msg.sentAtEpochMs) row.setAttribute("data-sent-at-epoch-ms", String(msg.sentAtEpochMs));
    if (msg.sentAtFull) {
      row.setAttribute("title", msg.sentAtFull);
      row.setAttribute("aria-label", (msg.role === "user" ? "你发送于 " : "小巴回复于 ") + msg.sentAtFull);
    }

    var bubble = document.createElement("div");
    bubble.className = "bubble";

    if (msg.role === "assistant") {
      var meta = document.createElement("div");
      meta.className = "meta";
      var metaLeft = document.createElement("span");
      metaLeft.className = "meta-left";
      var label = document.createElement("span");
      label.textContent = "小巴";
      metaLeft.appendChild(label);
      if (msg.sentAtShort) {
        var assistantTime = document.createElement("span");
        assistantTime.className = "message-time";
        assistantTime.textContent = msg.sentAtShort;
        metaLeft.appendChild(assistantTime);
      }
      meta.appendChild(metaLeft);
      if (msg.copy) {
        var btn = document.createElement("button");
        btn.className = "copy-btn";
        btn.type = "button";
        setCopyButtonState(btn, false);
        btn.addEventListener("click", function () {
          postCopy(msg.id);
          setCopyButtonState(btn, true);
          setTimeout(function () {
            setCopyButtonState(btn, false);
          }, 1500);
        });
        meta.appendChild(btn);
      }
      bubble.appendChild(meta);
    }

    var body = document.createElement("div");
    body.className = "body" + (msg.streaming ? " streaming" : "");
    body.innerHTML = msg.html;
    bindDynamicCardActions(body);
    // GenUI:把消息体里的 reva-ui 占位渲染成 SVG 折线图。流式态下 Swift 侧用 plain 文本、
    // 不产占位 → 这里自然 no-op,直到消息结算才有占位、才绘图(契约 §3.3 流式安全)。
    renderRevaCharts(body);
    bubble.appendChild(body);

    // meta footer(模型/数据源/Skill)— 仅助手、非流式、且有内容时由 Swift 侧给出。
    // footer 已是 Swift 端 escape 后的受控 HTML 片段;空字符串则不渲染。
    if (msg.role === "assistant" && msg.footer) {
      var footer = document.createElement("div");
      footer.className = "footer-wrap";
      footer.innerHTML = msg.footer;
      bubble.appendChild(footer);
    }

    if (msg.role === "user" && msg.sentAtShort) {
      var userTime = document.createElement("span");
      userTime.className = "message-time";
      userTime.textContent = msg.sentAtShort;
      row.appendChild(userTime);
    }
    row.appendChild(bubble);
    return row;
  }

  var TIME_DIVIDER_GAP_MS = 5 * 60 * 1000;
  function sameLocalDate(a, b) {
    return a.getFullYear() === b.getFullYear()
      && a.getMonth() === b.getMonth()
      && a.getDate() === b.getDate();
  }
  function shouldShowTimeDivider(previous, current) {
    if (!current || !current.sentAtEpochMs) return false;
    var currentDate = new Date(current.sentAtEpochMs);
    if (!previous || !previous.sentAtEpochMs) return true;
    var previousDate = new Date(previous.sentAtEpochMs);
    return !sameLocalDate(previousDate, currentDate)
      || currentDate.getTime() - previousDate.getTime() >= TIME_DIVIDER_GAP_MS;
  }
  function timeDividerLabel(msg) {
    if (!msg || !msg.sentAtEpochMs || !msg.sentAtShort) return "";
    var date = new Date(msg.sentAtEpochMs);
    var now = new Date();
    if (sameLocalDate(date, now)) return "今天 " + msg.sentAtShort;
    var yesterday = new Date(now);
    yesterday.setDate(now.getDate() - 1);
    if (sameLocalDate(date, yesterday)) return "昨天 " + msg.sentAtShort;
    return new Intl.DateTimeFormat("zh-CN", { month: "numeric", day: "numeric" }).format(date) + " " + msg.sentAtShort;
  }
  function makeTimeDivider(msg) {
    var label = timeDividerLabel(msg);
    if (!label) return null;
    var wrap = document.createElement("div");
    wrap.className = "message-time-divider";
    var text = document.createElement("span");
    text.textContent = label;
    wrap.appendChild(text);
    return wrap;
  }
  function appendMessageWithOptionalDivider(msg, previous) {
    if (shouldShowTimeDivider(previous, msg)) {
      var divider = makeTimeDivider(msg);
      if (divider) root.appendChild(divider);
    }
    root.appendChild(makeRow(msg));
  }
  function previousMessageMeta() {
    var rows = root.querySelectorAll(".row");
    if (!rows.length) return null;
    var last = rows[rows.length - 1];
    var raw = Number(last.getAttribute("data-sent-at-epoch-ms"));
    return raw ? { sentAtEpochMs: raw } : null;
  }

  function findRow(id) {
    return root.querySelector('.row[data-id="' + (window.CSS && CSS.escape ? CSS.escape(id) : id) + '"]');
  }

  window.chat = {
    // 全量替换(切换会话 / 历史加载)。messages: 数组,字段见 RenderedMessage。
    setMessages: function (messages) {
      root.innerHTML = "";
      var previous = null;
      for (var i = 0; i < messages.length; i++) {
        appendMessageWithOptionalDivider(messages[i], previous);
        previous = messages[i];
      }
      scheduleScrollToBottom(true);
    },
    // 追加新消息或更新最后一条(流式 token 合批喂入)。
    appendOrUpdateLast: function (msg) {
      var existing = findRow(msg.id);
      if (existing) {
        // 流式更新同一条消息:仅在用户已接近底部时跟随(尊重上滑翻历史)。
        var newRow = makeRow(msg);
        existing.replaceWith(newRow);
        scheduleScrollToBottom(false);
      } else {
        // 追加新消息(用户刚发送 / 新回合开始):必须强制滚到底,让新内容可见。
        appendMessageWithOptionalDivider(msg, previousMessageMeta());
        scheduleScrollToBottom(true);
      }
    },
    setFontScale: function (scale) {
      document.documentElement.style.setProperty("--font-scale", String(scale));
    }
  };

  // 通知 Swift 端 JS 就绪(此时可安全 evaluateJavaScript 喂消息)。
  try {
    if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.ready) {
      window.webkit.messageHandlers.ready.postMessage("ready");
    }
  } catch (e) {}
})();
</script>
</body>
</html>
