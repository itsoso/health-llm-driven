<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="colors_and_type.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    *::-webkit-scrollbar{ width:0; height:0; }
    [data-lucide]{ display:block; }
  </style>
</helmet>
<div style="min-height:100vh; box-sizing:border-box; display:flex; align-items:center; justify-content:center; padding:40px 0; background:radial-gradient(1200px 720px at 50% -8%, #EFEDE6 0%, transparent 58%), #E6E4DD; font-family:'Manrope','Noto Sans SC',system-ui,sans-serif;">
  <x-import component="RevaApp" from="./RevaApp.jsx" start-phase="{{ startPhase }}" hint-size="402px,874px"></x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:482,&quot;height&quot;:954},&quot;startPhase&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;app&quot;,&quot;onboard&quot;],&quot;default&quot;:&quot;app&quot;,&quot;tsType&quot;:&quot;'app'|'onboard'&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return { startPhase: this.props.startPhase ?? 'app' };
  }
}
</script>
</body>
</html>
