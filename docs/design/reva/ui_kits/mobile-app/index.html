<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>复元 Reva — 移动端 UI Kit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  html,body{ margin:0; height:100%; }
  body{
    background:
      radial-gradient(1200px 700px at 50% -10%, #ECEAE3 0%, transparent 60%),
      #E4E2DB;
    display:flex; align-items:center; justify-content:center; min-height:100vh;
    padding:32px 0; box-sizing:border-box;
    font-family:'Manrope','Noto Sans SC',system-ui,sans-serif;
  }
  #root{ transform-origin:center center; }
  .reva-ic svg, [data-lucide]{ display:block; }
  *::-webkit-scrollbar{ width:0; height:0; }
</style>
</head>
<body>
  <div id="root"></div>

  <!-- icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <!-- react + babel (pinned) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- kit -->
  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel" src="primitives.jsx"></script>
  <script type="text/babel" src="widgets.jsx"></script>
  <script type="text/babel" src="screens.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>

  <script>
    function fitReva(){
      var r = document.getElementById('root');
      if(!r || !r.firstChild) return;
      var dw = 402, dh = 874, m = 20;
      var s = Math.min((window.innerWidth - m*2)/dw, (window.innerHeight - m*2)/dh, 1);
      r.style.transform = 'scale(' + s + ')';
    }
    window.addEventListener('resize', fitReva);
    new ResizeObserver(fitReva).observe(document.getElementById('root'));
    fitReva();
  </script>
</body>
</html>
