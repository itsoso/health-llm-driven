<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--paper);}
  .card{width:700px;box-sizing:border-box;padding:24px 32px;display:flex;flex-direction:column;gap:10px;}
  .row{display:flex;align-items:baseline;gap:14px;}
  .row .t{font-family:var(--font-mono);font-size:10px;color:var(--ink-3);white-space:nowrap;margin-left:auto;}
</style></head>
<body><div class="card">
  <div class="row"><span class="overline">Today · 今天</span><span class="t">Overline · 600 · 11 · upper · +8% tracking</span></div>
  <div class="row"><span class="body">你的 LDL‑C 是 3.8 mmol/L，理想值在 3.4 以下。这是心血管风险里最值得先处理的一项。</span></div>
  <div class="row"><span class="t" style="margin:0;">Body · 400 · 15/1.55</span></div>
  <div class="row"><span class="body-2">早餐后散步 10 分钟，帮助餐后血糖回落。</span><span class="t">Body‑2 · 14 · ink‑2</span></div>
  <div class="row"><span class="caption">连接后，复元会用你的真实数据校准计划</span><span class="t">Caption · 12 · ink‑3</span></div>
  <div class="row"><span class="data-label">LDL‑C · 12 周趋势</span><span class="t">Data‑label · mono 12</span></div>
</div></body></html>
