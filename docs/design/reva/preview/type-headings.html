<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>

  .card{width:700px;box-sizing:border-box;padding:24px 32px;display:flex;flex-direction:column;gap:12px;}

<body><div class="card">
  <div class="row"><span class="h1">复元 · 今天的计划</span><span class="t">H1 · 800 · 28/-2%</span></div>
  <div class="row"><span class="h2">心代谢风险</span><span class="t">H2 · 700 · 22</span></div>
  <div class="row"><span class="h3">低密度脂蛋白偏高</span><span class="t">H3 · 700 · 18</span></div>
  <div class="row"><span class="title">连接你的手环</span><span class="t">Title · 600 · 16</span></div>
</div></body></html>
