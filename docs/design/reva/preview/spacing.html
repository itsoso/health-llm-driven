<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--paper);font-family:var(--font-sans);}
  .card{width:700px;box-sizing:border-box;padding:28px;display:flex;gap:10px;align-items:flex-end;}
  .sw{display:flex;flex-direction:column;gap:6px;align-items:center;}
  .bar{background:var(--green-300);border-radius:3px;width:26px;}
  .v{font-family:var(--font-mono);font-size:10px;color:var(--ink-3);}
  .nm{font-size:11px;font-weight:600;}
</style></head>
<body><div class="card">
  <div class="sw"><div class="bar" style="height:4px"></div><div class="nm">1</div><div class="v">4</div></div>
  <div class="sw"><div class="bar" style="height:8px"></div><div class="nm">2</div><div class="v">8</div></div>
  <div class="sw"><div class="bar" style="height:12px"></div><div class="nm">3</div><div class="v">12</div></div>
  <div class="sw"><div class="bar" style="height:16px"></div><div class="nm">4</div><div class="v">16</div></div>
  <div class="sw"><div class="bar" style="height:20px"></div><div class="nm">5</div><div class="v">20</div></div>
  <div class="sw"><div class="bar" style="height:24px"></div><div class="nm">6</div><div class="v">24</div></div>
  <div class="sw"><div class="bar" style="height:32px"></div><div class="nm">7</div><div class="v">32</div></div>
  <div class="sw"><div class="bar" style="height:40px"></div><div class="nm">8</div><div class="v">40</div></div>
  <div class="sw"><div class="bar" style="height:48px"></div><div class="nm">9</div><div class="v">48</div></div>
  <div class="sw"><div class="bar" style="height:64px"></div><div class="nm">10</div><div class="v">64</div></div>
  <div style="margin-left:auto;align-self:center;text-align:right;"><div class="nm">4px base grid</div><div class="v" style="color:var(--ink-2)">gutters 16–20 · sections 24–32</div></div>
</div></body></html>
