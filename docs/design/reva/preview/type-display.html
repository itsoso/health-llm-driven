<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--paper);}
  .card{width:700px;box-sizing:border-box;padding:28px 32px;display:flex;gap:40px;align-items:center;}
  .spec{display:flex;flex-direction:column;gap:6px;align-items:flex-start;}
  .lab{display:flex;align-items:baseline;gap:8px;}
  .tag{font-family:var(--font-mono);font-size:11px;color:var(--ink-3);}
</style></head>
<body><div class="card">
  <div class="spec">
    <div class="display">86<span class="unit" style="font-size:22px;margin-left:4px;">分</span></div>
    <div class="caption">Display · IBM Plex Mono 500 · 56/64 · tabular</div>
  </div>
  <div style="width:1px;height:80px;background:var(--line);"></div>
  <div class="spec">
    <div class="metric">3.1 <span class="unit">mmol/L</span></div>
    <div class="metric" style="color:var(--green-500);">↓ 0.7</div>
    <div class="caption">Metric · 30/32 · value + unit + delta</div>
  </div>
</div></body></html>
