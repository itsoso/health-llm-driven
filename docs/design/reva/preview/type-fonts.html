<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--paper);}
  .card{width:700px;box-sizing:border-box;padding:24px 32px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px;}
  .fam{display:flex;flex-direction:column;gap:6px;}
  .big{font-size:34px;line-height:1;color:var(--ink-1);}
  .nm{font-family:var(--font-mono);font-size:11px;color:var(--ink-3);}
  .sub{font-size:13px;color:var(--ink-2);}
</style></head>
<body><div class="card">
  <div class="fam">
    <div class="big" style="font-family:var(--font-sans);font-weight:800;">Manrope Aa</div>
    <div class="sub" style="font-family:var(--font-sans);">体检之后的 90 天</div>
    <div class="nm">Latin UI · 400–800</div>
  </div>
  <div class="fam">
    <div class="big" style="font-family:var(--font-cjk);font-weight:700;">思源黑 你好</div>
    <div class="sub" style="font-family:var(--font-cjk);">Noto Sans SC · 400/500/700</div>
    <div class="nm">CJK · subs PingFang SC</div>
  </div>
  <div class="fam">
    <div class="big" style="font-family:var(--font-mono);font-weight:500;">1234.0</div>
    <div class="sub" style="font-family:var(--font-mono);">mmHg · bpm · mmol/L</div>
    <div class="nm">IBM Plex Mono · data</div>
  </div>
</div></body></html>
