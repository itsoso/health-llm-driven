[Service]
# The runtime-state drop-in is the transactionally installed production
# artifact. Reset any older base unit command so process-local Garmin MFA
# challenges remain pinned to the worker that created them.
ExecStart=
ExecStart=/opt/health-app/backend/venv/bin/uvicorn main:app --fd 3 --workers 1 --limit-concurrency 100 --proxy-headers --forwarded-allow-ips=127.0.0.1 --no-access-log
ReadWritePaths=
ReadWritePaths=/var/lib/health-app/uploads /var/cache/health-app/skills-hub /var/lib/health-app/runtime /var/lib/health-app/dedao-kbase
