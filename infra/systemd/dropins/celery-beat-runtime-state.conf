[Service]
StateDirectory=health-app/celery-beat
StateDirectoryMode=0700
ReadWritePaths=
ReadWritePaths=/var/lib/health-app/celery-beat
ExecStart=
ExecStart=/opt/health-app/backend/venv/bin/celery -A app.celery_app:celery_app beat --loglevel=info --schedule=/var/lib/health-app/celery-beat/celerybeat-schedule

# Public application processes must not reach staking material or cloud metadata.
InaccessiblePaths=-/mnt -/opt/eth-ops
IPAddressDeny=100.64.0.0/10 169.254.0.0/16
CapabilityBoundingSet=
MemoryMax=512M
CPUQuota=50%
TasksMax=512
