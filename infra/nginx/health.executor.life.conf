server {
    listen 80;
    listen [::]:80;
    server_name health.executor.life;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name health.executor.life;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/health.executor.life/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/health.executor.life/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    client_max_body_size 10m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self)" always;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 180s;
        proxy_buffering off;
    }

    # Stable Mac download URL. The one-time bootstrap preserves this location
    # byte-for-byte and verifies its public content hash before and after.
    location = /xiaoba-mac.dmg {
        alias /opt/health-app-shared/assets/xiaoba-mac.dmg;
        default_type application/x-apple-diskimage;
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Reva-Artifact "xiaoba-mac-dmg" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    include /etc/nginx/snippets/reva-mac-release-routes.conf;

    # Rokid glasses push-up APK static distribution
    location = /rokid-pushup-glasses.apk {
        alias /opt/health-app-shared/assets/rokid-pushup-glasses.apk;
        default_type application/vnd.android.package-archive;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Reva-Artifact "rokid-pushup-glasses-apk" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
