# BEGIN REVA MANAGED MAC RELEASE ROUTES
location = /mac/current.json {
    alias /opt/health-app-shared/assets/mac/current.json;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Reva-Artifact "mac-current-manifest" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}

location ~ ^/mac/releases/([0-9a-f]{40})/([0-9a-f]{64})\.dmg$ {
    alias /opt/health-app-shared/assets/mac/releases/$1/$2.dmg;
    default_type application/x-apple-diskimage;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Reva-Artifact "mac-immutable-dmg" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}

location /mac/ {
    return 404;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
# END REVA MANAGED MAC RELEASE ROUTES
