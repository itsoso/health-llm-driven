# Candidate include inside the existing reviewed HTTPS server only.
# Do not include until bridge authentication and user handoffs are complete.
# Preserve the complete URI; OAuth metadata uses the exact resource paths.
location ^~ /neo-wechat/ {
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 32k;
    client_body_buffer_size 32k;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 65s;
    add_header Cache-Control "no-store" always;
    proxy_pass http://unix:/run/neo-wechat/bridge.sock;
}
location = /.well-known/oauth-authorization-server/neo-wechat {
    access_log off;
    error_log /dev/null crit;
    proxy_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";
    add_header Cache-Control "no-store" always;
    proxy_pass http://unix:/run/neo-wechat/bridge.sock;
}
location = /.well-known/oauth-protected-resource/neo-wechat/mcp {
    access_log off;
    error_log /dev/null crit;
    proxy_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";
    add_header Cache-Control "no-store" always;
    proxy_pass http://unix:/run/neo-wechat/bridge.sock;
}
