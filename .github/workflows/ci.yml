name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  classify-changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
      run_docs: ${{ steps.scope.outputs.run_docs }}
      run_backend: ${{ steps.scope.outputs.run_backend }}
      run_frontend: ${{ steps.scope.outputs.run_frontend }}
      run_mobile: ${{ steps.scope.outputs.run_mobile }}
      run_mac: ${{ steps.scope.outputs.run_mac }}
      run_type_drift: ${{ steps.scope.outputs.run_type_drift }}
      run_release: ${{ steps.scope.outputs.run_release }}
      release_only: ${{ steps.scope.outputs.release_only }}
      full: ${{ steps.scope.outputs.full }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          EVENT_NAME="${{ github.event_name }}"
          BEFORE_SHA="${{ github.event.before }}"
          BASE_REF="${{ github.base_ref }}"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            CHANGED_FILES=""
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            CHANGED_FILES="$(git diff --name-only "origin/${BASE_REF}...HEAD")"
          elif [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ]] || \
               ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            CHANGED_FILES=""
          else
            CHANGED_FILES="$(git diff --name-only "$BEFORE_SHA" HEAD)"
          fi
          printf '%s\n' "$CHANGED_FILES" | \
            python3 scripts/ci_change_scope.py \
              --event-name "$EVENT_NAME" --format github >> "$GITHUB_OUTPUT"

      - name: Build timing-balanced pytest matrix
        id: plan
        if: ${{ steps.scope.outputs.run_backend == 'true' }}
        run: >-
          python3 backend/scripts/build_ci_pytest_matrix.py
          --workers 16 --github-output "$GITHUB_OUTPUT"

  docs-quality:
    runs-on: ubuntu-latest
    needs: classify-changes
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install lightweight documentation dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest==9.1.1 -r scripts/system-map-requirements.txt

      - name: Scan tracked files for high-confidence secrets
        run: python scripts/check_secret_leaks.py

      - name: Check System Map and doc drift
        env:
          SECRET_KEY: test-secret-key-32-chars-minimum!!
          GARMIN_ENCRYPTION_KEY: mI4nYXirjGlbHD7sFogYlqPQJzirU04mUsS5LyDS0SU=
          DATABASE_URL: "sqlite:///:memory:"
          TZ: Asia/Shanghai
        run: python scripts/check_system_map.py

      - name: Test System Map harness
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTEST_ADDOPTS: ""
          PYTEST_PLUGINS: ""
        run: >-
          python -m pytest
          --noconftest
          -c /dev/null
          --rootdir .
          -o addopts=
          -q
          --strict-markers
          --tb=short
          -p no:cacheprovider
          scripts/test_system_map_harness.py

      - name: Check dossier consistency
        run: python backend/scripts/check_dossier_consistency.py

      - name: Check Agent Skill governance
        run: python scripts/check_agent_skill_governance.py check

  backend-test-shards:
    name: backend-test-${{ matrix.label }}
    runs-on: ubuntu-latest
    needs:
      - classify-changes
    if: ${{ needs.classify-changes.outputs.run_backend == 'true' }}
    # Each catalog shard remains a fresh pytest process. Workers only share the
    # dependency install, then execute isolated processes in historical-time
    # balanced order. This preserves the SQLite isolation contract.
    # The oversized shard runs two ordered processes to preserve the existing
    # SQLite fixture contract. Keep enough job budget for both process deadlines
    # plus setup and cleanup; the contract test derives this from the catalog.
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.classify-changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22.19.0"
          cache: npm
          cache-dependency-path: backend/pi-runtime/package-lock.json

      - name: Install and verify official Pi kernel
        working-directory: backend/pi-runtime
        run: |
          npm ci --ignore-scripts
          npm test
          npm audit --omit=dev

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install --require-hashes -r requirements.lock
          pip install -r requirements-dev.txt

      - name: Run isolated shards (${{ matrix.label }})
        working-directory: backend
        env:
          SECRET_KEY: test-secret-key-32-chars-minimum!!
          GARMIN_ENCRYPTION_KEY: mI4nYXirjGlbHD7sFogYlqPQJzirU04mUsS5LyDS0SU=
          DATABASE_URL: "sqlite:///:memory:"
          TZ: Asia/Shanghai
        run: >-
          python scripts/run_ci_pytest_worker.py
          --shards "${{ matrix.shards }}"
          --junit-dir test-results

      - name: Upload pytest timing (${{ matrix.label }})
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pytest-timing-${{ matrix.label }}
          path: backend/test-results/*.xml
          if-no-files-found: warn
          retention-days: 14

  backend-quality:
    runs-on: ubuntu-latest
    needs: classify-changes
    if: ${{ needs.classify-changes.outputs.run_backend == 'true' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # LLM live-change gate needs a reliable base...HEAD diff

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements-dev.txt
            scripts/system-map-requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install --require-hashes -r requirements.lock
          pip install -r requirements-dev.txt
          pip install -r ../scripts/system-map-requirements.txt

      - name: Audit production Python dependencies
        working-directory: backend
        run: python -m pip_audit -r requirements.lock --require-hashes --progress-spinner=off

      - name: Health MCP tool contracts
        run: python -m pytest --noconftest -c /dev/null --rootdir . -o addopts= -o asyncio_mode=auto -p no:cacheprovider -q mcp-server/tests

      - name: Independent WeChat bridge audit and isolated tests
        run: |
          python -m pip_audit -r services/neo_wechat/requirements.lock --require-hashes --progress-spinner=off
          python -m venv /tmp/neo-wechat-ci
          /tmp/neo-wechat-ci/bin/pip install --require-hashes --only-binary=:all: -r services/neo_wechat/requirements.lock
          /tmp/neo-wechat-ci/bin/pip install pytest==9.1.1
          /tmp/neo-wechat-ci/bin/python -m pytest -q services/neo_wechat/tests
          node --check services/neo_wechat/qr.js

      - name: Lint (ruff, non-blocking warnings)
        working-directory: backend
        continue-on-error: true
        run: |
          pip install ruff
          # 现有 776 个 lint 警告, 暂不阻塞 CI; 只暴露给 PR review
          ruff check app/ --output-format=github

      - name: Lint (ruff, blocking — undefined names / syntax)
        working-directory: backend
        # F821=未定义名 (潜在 NameError), F822=__all__ 列了未定义符号,
        # E9=语法错。这三类是必然 bug, 不该进库 —— 硬阻塞。
        # 已在 fix/f821-undefined-names 把命中归零, 设阻塞才不会立红。
        run: |
          pip install ruff
          ruff check app/ --select F821,F822,E9 --output-format=github

      - name: LLM live-change regression gate
        env:
          HARNESS_CHANGE_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
          HARNESS_LIVE_LLM_EVAL_CONFIRMED: ${{ vars.HARNESS_LIVE_LLM_EVAL_CONFIRMED }}
          HARNESS_LIVE_LLM_EVAL_TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        # Zero-cost path gate: high-risk LLM/prompt/model/eval changes must carry explicit live-eval evidence.
        run: python scripts/harness_llm_change_gate.py --base-ref "$HARNESS_CHANGE_BASE_REF"

      - name: LLM synthesis regression gate
        env:
          SECRET_KEY: test-secret-key-32-chars-minimum!!
          GARMIN_ENCRYPTION_KEY: mI4nYXirjGlbHD7sFogYlqPQJzirU04mUsS5LyDS0SU=
          DATABASE_URL: "sqlite:///:memory:"
          TZ: Asia/Shanghai
        # Hard gate: zero-cost synthesis invariant + health-agent rubric evals.
        # Live LLM suites stay explicit: python scripts/harness_llm_regression_gate.py --include-live-llm
        run: python scripts/harness_llm_regression_gate.py

      - name: Eval Golden Set (safety + insight + retrieval, no LLM cost)
        working-directory: backend
        env:
          SECRET_KEY: test-secret-key-32-chars-minimum!!
          GARMIN_ENCRYPTION_KEY: mI4nYXirjGlbHD7sFogYlqPQJzirU04mUsS5LyDS0SU=
          DATABASE_URL: "sqlite:///:memory:"
          TZ: Asia/Shanghai
        # 软 gate: 失败不阻塞合并, 仅暴露 regression 列表给 PR review
        # orchestrator suite 不在此跑 (会调真实 LLM, 应手动 / 夜间触发)
        # retrieval: 端到端验证 agent 工具真去查 DB + 返回对的数据 (内存 SQLite, 无 LLM)
        continue-on-error: true
        run: |
          python -m eval run --suite safety --baseline main --fail-on-regression
          python -m eval run --suite insight --baseline main --fail-on-regression
          python -m eval run --suite retrieval --baseline main --fail-on-regression

      - name: System KB retrieval eval (observation mode)
        working-directory: backend
        env:
          SECRET_KEY: test-secret-key-32-chars-minimum!!
          GARMIN_ENCRYPTION_KEY: mI4nYXirjGlbHD7sFogYlqPQJzirU04mUsS5LyDS0SU=
          DATABASE_URL: "sqlite:///:memory:"
          TZ: Asia/Shanghai
        # 观察周(2026-07):软 gate, 只打印 recall@5/recall@10/MRR + 每 case pass/rank,
        # 不阻塞合并。稳定后再复议是否转硬 gate(与既有 Golden Set continue-on-error 同属
        # 一次 observability 复议, 那道 gate 现状不动)。ephemeral SQLite, 无 LLM 成本;
        # FTS 走 precomputed-text 回退(tsvector 是 PG-only), retrieval_legs 里如实标注。
        continue-on-error: true
        run: |
          python scripts/run_system_kb_eval.py --json | tee /tmp/system_kb_eval_metrics.json

      - name: Upload System KB eval metrics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: system-kb-eval-metrics
          path: /tmp/system_kb_eval_metrics.json
          if-no-files-found: ignore

  neo-wechat-systemd249:
    runs-on: ubuntu-22.04
    needs: classify-changes
    if: ${{ needs.classify-changes.outputs.run_release == 'true' }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Verify actual target systemd 249 containment with synthetic fixtures
        run: |
          trap 'cat /tmp/neo-wechat-systemd249.json' EXIT
          sudo /usr/bin/python3 scripts/neo_wechat_linux_probe.py --ephemeral-runner --require-linux > /tmp/neo-wechat-systemd249.json
          python3 - <<'PY'
          import json
          with open('/tmp/neo-wechat-systemd249.json') as stream:
              result = json.load(stream)
          assert result['status'] == 'PASS' and result['systemd_249_observed'] is True, 'Target systemd 249 was not verified'
          PY

  release-invariants:
    name: release-invariants
    runs-on: ubuntu-latest
    needs: [classify-changes, neo-wechat-systemd249]
    if: ${{ needs.classify-changes.outputs.run_release == 'true' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          # OTA release-contract tests compare HEAD with canonical main.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          package-manager-cache: false

      - name: Verify installed release-tool consumers before publishing
        run: |
          npm ci --prefix scripts/release-tools --ignore-scripts --no-audit --no-fund
          node scripts/node-forge-backport.cjs --root scripts/release-tools --apply
          node frontend/scripts/braces-depth-guard.cjs --root scripts/release-tools --apply
          BRACES_TEST_ROOT=scripts/release-tools node --test scripts/braces-depth-regression.test.cjs scripts/braces-depth-guard.test.cjs
          node scripts/release-tools/apply-compat-patches.cjs
          node --test scripts/release-tools/compat.test.cjs
          node --test scripts/node-forge-backport.test.cjs scripts/osv-npm-audit-gate.test.mjs scripts/osv-npm-audit-backport.integration.test.mjs
          cd scripts/release-tools
          node ../osv-npm-audit-gate.mjs

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements-dev.txt

      - name: Install release-test dependencies
        working-directory: backend
        run: |
          pip install --require-hashes -r requirements.lock
          pip install -r requirements-dev.txt

      - name: Verify real application network boundary in isolated namespace
        run: sudo unshare --net /usr/bin/python3 scripts/test_public_host_network_native.py

      - name: Verify synthetic WeChat systemd containment on disposable runner
        run: sudo /usr/bin/python3 scripts/neo_wechat_linux_probe.py --ephemeral-runner --require-linux

      - name: Verify real retained runner filesystem and canonical startup
        run: sudo "$(command -v python)" -B -m pytest -q --no-cov scripts/test_trusted_retained_testflight.py -k real_linux_runner_bootstrap_and_loader

      - name: Run deployment and rollback invariants
        run: >-
          python -m pytest -q --no-cov --tb=short --maxfail=1
          scripts/test_backup_security.py
          scripts/test_ci_change_scope.py
          scripts/test_deploy_script.py
          scripts/test_release_timing.py
          scripts/test_release_performance_report.py
          scripts/test_trusted_ota_startup.py
          scripts/test_generate_api_types.py
          scripts/test_health_evidence_activation_runner.py
          scripts/test_release_lock.py
          scripts/test_release_rollback.py
          scripts/test_infrastructure_security.py
          scripts/test_mobile_fast_feedback_scripts.py
          scripts/test_runtime_state_release_transaction.py
          scripts/test_release_ci_contract.py
          scripts/test_release_input_digest.py
          scripts/test_verify_locked_requirements.py
          scripts/test_prune_unlocked_requirements.py
          scripts/test_public_host_boundaries.py
          scripts/test_trusted_release_gate.py
          scripts/test_backend_release_scope.py
          scripts/test_run_postgres_ci.py
          scripts/test_trusted_backend_admission.py
          scripts/test_backend_release_wiring.py
          scripts/test_trusted_deploy_source.py
          scripts/test_trusted_release_workflow.py
          scripts/test_trusted_runner_transport.py
          scripts/test_trusted_release_receipt.py
          scripts/test_trusted_release_server.py
          scripts/test_native_release_retirement.py
          scripts/test_native_finalized_advance.py
          scripts/test_business_lease_sync.py
          scripts/test_frontend_verified_finalization.py
          scripts/test_frontend_finalization_integration.py
          scripts/test_trusted_ota.py
          scripts/test_trusted_ota_server.py
          scripts/test_trusted_ota_workflow.py
          scripts/test_trusted_ota_publish.py
          scripts/test_testflight_only.py
          scripts/test_trusted_retained_testflight.py
          scripts/test_trusted_frontend_rebuild.py
          scripts/test_trusted_vision_model.py
          scripts/test_trusted_neo_wechat.py
          scripts/test_neo_wechat_linux_isolation.py
          scripts/test_neo_wechat_provisioning.py
          scripts/test_neo_wechat_lifecycle.py
          scripts/test_trusted_frontend_publish.py
          scripts/test_trusted_frontend_artifact.py
          scripts/test_trusted_frontend_publish_history.py
          scripts/test_trusted_frontend_history_seal.py
          scripts/test_frontend_history_seal_bootstrap.py
          scripts/test_frontend_stopped_recovery.py
          scripts/test_bootstrap_trusted_release.py
          scripts/test_trusted_review_reset.py
          scripts/test_review_maintenance_retirement.py
          scripts/test_admin_key_pause.py
          scripts/test_recover_contained_services.py
          scripts/test_contained_recovery_proof.py
          scripts/test_built_unuploaded_proof.py
          scripts/test_contained_release_retirement.py
          scripts/test_lost_closure_receipt_acknowledgment.py
          scripts/test_partial_laya_retirement.py
          scripts/test_mobile_local_qr_script.py
          scripts/test_mobile_local_qr_safety.py
          scripts/test_legacy_release_recovery.py
          scripts/test_release_parallel.py
          scripts/test_trusted_eas_build.py
          scripts/test_release_acceptance.py
          scripts/test_ci_timing_refresh.py

      - name: Verify isolated OpenSSH single-key pause and restore
        env:
          REVA_TEST_NATIVE_SSH: "1"
        run: |
          test -x /usr/sbin/sshd || (sudo apt-get update -qq && sudo apt-get install -y openssh-server)
          sudo mkdir -p /run/sshd
          native_dir="$(sudo mktemp -d /root/reva-sshd-test.XXXXXX)"
          sudo --preserve-env=REVA_TEST_NATIVE_SSH "$(command -v python)" -m pytest --basetemp="$native_dir/pytest" --noconftest --no-cov -q scripts/test_admin_key_pause.py -k native_openssh

      - name: Verify frontend builder uses a private mount namespace and dynamic UID
        env:
          REVA_TEST_FRONTEND_SANDBOX: "1"
        run: |
          # setup-node lives in /opt, which the real production sandbox must hide.
          # Give this disposable runner the same fixed /usr/bin tool interface;
          # never weaken the data-root deny list or skip the real npm probe.
          node_root="$(dirname "$(dirname "$(readlink -f "$(command -v node)")")")"
          test "$("$node_root/bin/node" --version)" = v22.13.0
          test ! -e /usr/local/lib/reva-frontend-test-node
          sudo cp -a "$node_root" /usr/local/lib/reva-frontend-test-node
          sudo chown -hR root:root /usr/local/lib/reva-frontend-test-node
          sudo ln -sfn /usr/local/lib/reva-frontend-test-node/bin/node /usr/bin/node
          sudo ln -sfn /usr/local/lib/reva-frontend-test-node/lib/node_modules/npm/bin/npm-cli.js /usr/bin/npm
          /usr/bin/node --version
          /usr/bin/npm --version
          native_dir="$(sudo mktemp -d /root/reva-frontend-test.XXXXXX)"
          sudo --preserve-env=REVA_TEST_FRONTEND_SANDBOX "$(command -v python)" -m pytest --basetemp="$native_dir/pytest" --noconftest --no-cov -q scripts/test_trusted_frontend_rebuild.py -k native_frontend_sandbox

  frontend-artifact-integration:
    name: frontend-artifact-integration
    runs-on: ubuntu-24.04
    needs: classify-changes
    if: ${{ needs.classify-changes.outputs.run_release == 'true' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install isolated artifact test dependencies
        run: python -m pip install pytest==9.1.1
      - name: Build and consume a real frontend artifact without recompiling
        run: |
          # setup-node lives in /opt, which the real production sandbox must hide.
          # Give this disposable runner the same fixed /usr/bin tool interface;
          # never weaken the data-root deny list or skip the real npm probe.
          node_root="$(dirname "$(dirname "$(readlink -f "$(command -v node)")")")"
          test "$("$node_root/bin/node" --version)" = v22.13.0
          test ! -e /usr/local/lib/reva-frontend-test-node
          sudo cp -a "$node_root" /usr/local/lib/reva-frontend-test-node
          sudo chown -hR root:root /usr/local/lib/reva-frontend-test-node
          sudo ln -sfn /usr/local/lib/reva-frontend-test-node/bin/node /usr/bin/node
          sudo ln -sfn /usr/local/lib/reva-frontend-test-node/lib/node_modules/npm/bin/npm-cli.js /usr/bin/npm
          /usr/bin/node --version
          /usr/bin/npm --version
          sudo env REVA_TEST_FRONTEND_ARTIFACT_BUILD=1 "$(command -v python)" -m pytest --noconftest -c /dev/null -o addopts= -q scripts/test_trusted_frontend_artifact.py -k native_prepare

  agent-runtime-postgres:
    name: agent-runtime-postgres
    runs-on: ubuntu-latest
    needs: classify-changes
    if: ${{ needs.classify-changes.outputs.run_backend == 'true' }}
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: health_runtime_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d health_runtime_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --tmpfs /var/lib/postgresql/data:rw
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22.19.0"

      - name: Install official Pi for PostgreSQL integration
        working-directory: backend/pi-runtime
        run: npm ci --ignore-scripts --no-fund

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install --require-hashes -r requirements.lock
          pip install -r requirements-dev.txt

      - name: Verify live-run task publishing on isolated Redis
        working-directory: backend
        env:
          APP_ENV: test
          CI: "true"
          DATABASE_URL: "sqlite:///:memory:"
          REDIS_URL: redis://127.0.0.1:1/15
          SECRET_KEY: test-secret-key-32-chars-minimum!!
          GARMIN_ENCRYPTION_KEY: mI4nYXirjGlbHD7sFogYlqPQJzirU04mUsS5LyDS0SU=
          TEST_LIVE_RUN_BROKER_URL: redis://127.0.0.1:6379/15
        run: |
          test -n "$TEST_LIVE_RUN_BROKER_URL"
          python -m pytest -q --no-cov --tb=short --maxfail=1 tests/test_live_run_broker_integration.py

      - name: Verify isolated review closure PostgreSQL boundary
        env:
          REVA_REVIEW_CLOSURE_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/health_runtime_test
        run: python -m pytest -q --noconftest --no-cov scripts/test_review_maintenance_retirement.py -k postgres

      - name: Verify Runtime migration upgrade and idempotency
        working-directory: backend
        env:
          PGPASSWORD: postgres
          PG_URL: postgresql://postgres:postgres@localhost:5432/health_runtime_test
        run: |
          set -euo pipefail
          psql "$PG_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DROP SCHEMA public CASCADE;
          CREATE SCHEMA public;
          CREATE TABLE users (id INTEGER PRIMARY KEY);
          CREATE TABLE agent_conversations (id INTEGER PRIMARY KEY);
          CREATE TABLE agent_messages (id INTEGER PRIMARY KEY);
          INSERT INTO users (id) VALUES (1);
          SQL
          psql "$PG_URL" -v ON_ERROR_STOP=1 -f migrations/managed/20260719_120000_create_agent_runtime.postgresql.sql
          psql "$PG_URL" -v ON_ERROR_STOP=1 -f migrations/managed/20260719_180000_agent_runtime_resilience.postgresql.sql
          psql "$PG_URL" -v ON_ERROR_STOP=1 -f migrations/managed/20260720_120000_agent_runtime_rollout.postgresql.sql
          psql "$PG_URL" -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO agent_runs
              (run_id, user_id, status, current_attempt_id, origin)
          VALUES ('legacy-run', 1, 'running', 'legacy-attempt', 'ci');
          INSERT INTO agent_run_attempts
              (attempt_id, run_id, attempt_no, status)
          VALUES ('legacy-attempt', 'legacy-run', 2, 'running');
          INSERT INTO agent_tool_operations
              (operation_id, run_id, attempt_id, tool_name, effect_class,
               operation_fingerprint, status)
          VALUES ('legacy-operation', 'legacy-run', 'legacy-attempt',
                  'health_record', 'write', repeat('a', 64), 'succeeded');
          SQL
          psql "$PG_URL" -v ON_ERROR_STOP=1 -f migrations/managed/20260720_180000_agent_runtime_operation_lineage.postgresql.sql
          psql "$PG_URL" -v ON_ERROR_STOP=1 -f migrations/managed/20260720_180000_agent_runtime_operation_lineage.postgresql.sql
          test "$(psql "$PG_URL" -Atc "SELECT logical_operation_key_hash FROM agent_tool_operations WHERE operation_id='legacy-operation'")" = "$(printf 'a%.0s' {1..64})"
          test "$(psql "$PG_URL" -Atc "SELECT (created_attempt_no IS NULL)::int FROM agent_tool_operations WHERE operation_id='legacy-operation'")" = "1"
          test "$(psql "$PG_URL" -Atc "SELECT COUNT(*) FROM information_schema.columns WHERE table_name='agent_tool_operations' AND column_name IN ('logical_operation_scope_hash', 'logical_operation_discriminator_kind', 'logical_operation_discriminator_hash')")" = "3"
          test "$(psql "$PG_URL" -Atc "SELECT COUNT(*) FROM pg_indexes WHERE indexname='uq_agent_tool_operations_run_logical_key'")" = "1"
          test "$(psql "$PG_URL" -Atc "SELECT COUNT(*) FROM pg_indexes WHERE indexname='ix_agent_tool_operations_run_scope'")" = "1"
          psql "$PG_URL" -v ON_ERROR_STOP=1 -c 'DROP SCHEMA public CASCADE; CREATE SCHEMA public;'

      - name: Verify PostgreSQL shard database isolation
        env:
          APP_ENV: test
          CI: "true"
          REVA_PG_PARALLEL_TEST_URL: postgresql://postgres:postgres@localhost:5432/health_runtime_test
          REVA_REDIS_PARALLEL_TEST_URL: redis://127.0.0.1:6379/0
        run: python -m pytest -q --no-cov scripts/test_run_postgres_ci.py -k real_postgres

      - name: Run Runtime and medication PostgreSQL semantics
        working-directory: backend
        env:
          APP_ENV: test
          CI: "true"
          REDIS_URL: redis://127.0.0.1:6379/0
          SECRET_KEY: test-secret-key-32-chars-minimum!!
          GARMIN_ENCRYPTION_KEY: mI4nYXirjGlbHD7sFogYlqPQJzirU04mUsS5LyDS0SU=
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/health_runtime_test
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/health_runtime_test
          REGISTRATION_INVITATION_ROLLOUT_ENABLED: "true"
          REGISTRATION_INVITATION_ENFORCEMENT_ENABLED: "true"
          TZ: Asia/Shanghai
        run: python ../scripts/run_postgres_ci.py --output "$RUNNER_TEMP/postgres-ci"

      - name: Preserve PostgreSQL shard evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: postgres-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/postgres-ci/
          if-no-files-found: warn
          retention-days: 14

  backend-tests:
    runs-on: ubuntu-latest
    needs:
      - classify-changes
      - docs-quality
      - backend-test-shards
      - backend-quality
      - agent-runtime-postgres
    if: ${{ always() }}
    steps:
      - name: Enforce backend test and quality gates
        env:
          RUN_BACKEND: ${{ needs.classify-changes.outputs.run_backend }}
          DOCS_QUALITY: ${{ needs.docs-quality.result }}
          TEST_SHARDS: ${{ needs.backend-test-shards.result }}
          QUALITY_GATES: ${{ needs.backend-quality.result }}
          RUNTIME_POSTGRES: ${{ needs.agent-runtime-postgres.result }}
        run: |
          printf 'backend gates: selected=%s docs=%s test-shards=%s quality=%s runtime-postgres=%s\n' \
            "$RUN_BACKEND" "$DOCS_QUALITY" "$TEST_SHARDS" "$QUALITY_GATES" "$RUNTIME_POSTGRES"
          if [[ "$DOCS_QUALITY" != success ]]; then
            exit 1
          fi
          if [[ "$RUN_BACKEND" != true ]]; then
            echo "backend scope skipped by classifier"
            exit 0
          fi
          if [[ "$TEST_SHARDS" != success || "$QUALITY_GATES" != success || "$RUNTIME_POSTGRES" != success ]]; then
            exit 1
          fi

  backend-release-ready-v1:
    runs-on: ubuntu-latest
    needs: [classify-changes, docs-quality, backend-test-shards, backend-quality, agent-runtime-postgres, backend-tests, release-invariants, type-drift]
    if: ${{ always() && github.event_name != 'pull_request' && needs.classify-changes.outputs.run_backend == 'true' && needs.classify-changes.outputs.run_release == 'true' && needs.classify-changes.outputs.run_type_drift == 'true' }}
    steps:
      - name: Require every backend release dependency to have actually passed
        env:
          REQUIRED_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = json.loads(os.environ['REQUIRED_RESULTS'])
          expected = {'classify-changes', 'docs-quality', 'backend-test-shards', 'backend-quality', 'agent-runtime-postgres', 'backend-tests', 'release-invariants', 'type-drift'}
          if set(results) != expected or any(value.get('result') != 'success' for value in results.values()):
              sys.exit('Backend release checks missing or not successful')
          print('backend-v1 target checks passed; production scope admission is still required')
          PY

  retained-runner-startup:
    runs-on: ubuntu-24.04
    needs: classify-changes
    if: ${{ needs.classify-changes.outputs.run_release == 'true' }}
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install only the credential-free test adapter dependencies
        run: python -m pip install --disable-pip-version-check pytest==9.1.1 PyYAML==6.0.3

      - name: Materialize exact retained startup pipeline without release admission
        run: python -B scripts/test_trusted_retained_testflight.py --fidelity-phase materialize

      - name: First publisher Node setup on this fresh runner
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.13.0
          package-manager-cache: false

      - name: Exercise actual retained dependency installation and patches
        run: python -B scripts/test_trusted_retained_testflight.py --fidelity-phase tools

      - name: Exercise actual isolated retained startup CLI without credentials
        run: python -B scripts/test_trusted_retained_testflight.py --fidelity-phase smoke

  ota-runner-startup:
    runs-on: ubuntu-24.04
    needs: classify-changes
    if: ${{ needs.classify-changes.outputs.run_release == 'true' }}
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install credential-free OTA test adapter dependencies
        run: python -m pip install --disable-pip-version-check pytest==9.1.1 PyYAML==6.0.3
      - name: Materialize actual OTA startup without release admission
        run: python -B scripts/test_trusted_ota_startup.py --fidelity-phase materialize
      - name: Fixed OTA publisher Node toolchain
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.13.0
          package-manager-cache: false
      - name: Exercise actual OTA dependencies and patches
        run: python -B scripts/test_trusted_ota_startup.py --fidelity-phase tools
      - name: Exercise actual isolated OTA preflight
        run: python -B scripts/test_trusted_ota_startup.py --fidelity-phase smoke
      - name: Export and verify real iOS artifact without publishing
        run: python -B scripts/test_trusted_ota_startup.py --fidelity-phase export

  release-tests:
    runs-on: ubuntu-latest
    needs:
      - classify-changes
      - docs-quality
      - release-invariants
      - retained-runner-startup
      - ota-runner-startup
    if: ${{ always() }}
    steps:
      - name: Enforce release-only gates
        env:
          RUN_RELEASE: ${{ needs.classify-changes.outputs.run_release }}
          DOCS_QUALITY: ${{ needs.docs-quality.result }}
          RELEASE_INVARIANTS: ${{ needs.release-invariants.result }}
          RETAINED_STARTUP: ${{ needs.retained-runner-startup.result }}
          OTA_STARTUP: ${{ needs.ota-runner-startup.result }}
        run: |
          printf 'release gates: selected=%s docs=%s invariants=%s retained-startup=%s ota-startup=%s\n' \
            "$RUN_RELEASE" "$DOCS_QUALITY" "$RELEASE_INVARIANTS" "$RETAINED_STARTUP" "$OTA_STARTUP"
          if [[ "$DOCS_QUALITY" != success ]]; then
            exit 1
          fi
          if [[ "$RUN_RELEASE" != true ]]; then
            echo "release scope skipped by classifier"
            exit 0
          fi
          if [[ "$RELEASE_INVARIANTS" != success || "$RETAINED_STARTUP" != success || "$OTA_STARTUP" != success ]]; then
            exit 1
          fi

  frontend-build:
    runs-on: ubuntu-latest
    needs: classify-changes
    if: ${{ needs.classify-changes.outputs.run_frontend == 'true' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # page-freeze 需要 vs main 的完整历史

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Check frontend page freeze (Phase 0-4)
        # Agent Native Mobile First: frontend 新 page 冻结; admin/ api/ 豁免.
        # 绕过: 在 commit message 加 FREEZE_OVERRIDE 字样 (并说明理由).
        run: bash scripts/check_frontend_page_freeze.sh origin/main

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit production dependencies
        working-directory: frontend
        run: node ../scripts/osv-npm-audit-gate.mjs

      - name: Test OSV dependency audit gate
        run: |
          node --test scripts/osv-npm-audit-gate.test.mjs
          BRACES_TEST_ROOT=frontend node --test scripts/braces-depth-regression.test.cjs scripts/braces-depth-guard.test.cjs

      - name: Test (vitest)
        working-directory: frontend
        run: npm run test

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Lint
        working-directory: frontend
        run: npm run lint

  mobile-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: classify-changes
    if: ${{ needs.classify-changes.outputs.run_mobile == 'true' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Verify installed signature backport
        run: |
          node scripts/node-forge-backport.cjs --root mobile
          node frontend/scripts/braces-depth-guard.cjs --root mobile
          node --test scripts/braces-depth-regression.test.cjs scripts/braces-depth-guard.test.cjs
          node --test scripts/node-forge-backport.test.cjs scripts/osv-npm-audit-backport.integration.test.mjs

      - name: Test patched image parser denial-of-service guards
        working-directory: mobile
        run: node --test scripts/image-size-security.node.js

      - name: Audit production dependencies
        working-directory: mobile
        run: node ../scripts/osv-npm-audit-gate.mjs --policy npm-audit-policy.json

      - name: Test OSV dependency audit gate
        run: node --test scripts/osv-npm-audit-gate.test.mjs

      - name: TypeScript check
        working-directory: mobile
        run: npx tsc --noEmit

      - name: Design token gate (复元 Reva ratchet)
        working-directory: mobile
        run: npm run design:check

      - name: Test (jest main suite)
        working-directory: mobile
        run: >-
          npx jest --silent --passWithNoTests --forceExit
          --testPathIgnorePatterns='components/chat/__tests__/ChatInputBar.test.tsx|app/\(tabs\)/__tests__/chat.test.tsx|hooks/__tests__/useAuth.test.tsx|hooks/__tests__/useGPSOnboardingPrompt.test.ts'

      - name: Test stateful chat input (isolated)
        working-directory: mobile
        run: npx jest --runTestsByPath components/chat/__tests__/ChatInputBar.test.tsx --runInBand --silent --forceExit

      - name: Test stateful chat screen (isolated)
        working-directory: mobile
        run: npx jest --runTestsByPath 'app/(tabs)/__tests__/chat.test.tsx' --runInBand --silent --forceExit

      - name: Test stateful auth hook (isolated)
        working-directory: mobile
        run: npx jest --runTestsByPath hooks/__tests__/useAuth.test.tsx --runInBand --silent --forceExit

      - name: Test stateful GPS prompt hook (isolated)
        working-directory: mobile
        run: npx jest --runTestsByPath hooks/__tests__/useGPSOnboardingPrompt.test.ts --runInBand --silent --forceExit

  mac-build:
    # Catches non-compiling mac app pushes that the ubuntu jobs can't (the app is
    # a SwiftPM package; only macOS runners have Swift + the SDKs to build it).
    runs-on: macos-latest
    needs: classify-changes
    if: ${{ needs.classify-changes.outputs.run_mac == 'true' }}
    steps:
      - uses: actions/checkout@v5

      # Pin a recent stable Xcode so the type-checker/concurrency behavior is
      # predictable across runner image updates (the default can lag and differ
      # from local Xcode, surfacing toolchain-specific compile errors).
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Exercise release shell contracts with macOS Bash 3
        run: |
          /bin/bash --version
          /bin/bash -n deploy.sh backend/scripts/activate_health_evidence_runtime.sh backend/scripts/rollback_release.sh
          python -m pip install -r backend/requirements-dev.txt
          python -m pytest -q --no-cov --tb=short --maxfail=1 \
            scripts/test_deploy_script.py::test_repository_trust_normalization_makes_tracked_seeds_readable_not_writable \
            scripts/test_deploy_script.py::test_deactivation_proof_rejects_restart_of_only_celery_beat \
            scripts/test_health_evidence_activation_runner.py::test_activation_restart_during_stability_window_recovers_to_guard \
            scripts/test_release_rollback.py::test_release_rollback_restart_window_never_claims_success

      - name: Build (swift build)
        working-directory: apps/mac
        run: swift build

      - name: Test (logic suite only)
        working-directory: apps/mac
        # Only the logic/core suite. The HealthAgentMacTests snapshot suite does
        # pixel diffs that are environment-sensitive (fonts/antialiasing differ on
        # CI runners) — running it here would fail for rendering reasons, not real
        # regressions. Snapshot tests stay a local/manual check.
        run: swift test --filter HealthAgentMacCoreTests

  type-drift:
    # 后端 OpenAPI → 客户端 typed clients(mobile + frontend api.generated.ts)100% 代码可派生,
    # 之前完全无护栏:后端 schema 改名/删字段会静默漂移到客户端类型,直到运行时 422 才暴露
    # (历史教训: sleep_hours vs total_sleep_minutes、float→int 422)。本 job 在 CI 重新生成
    # 两端类型并 git diff --exit-code,不一致即红;修复 = 本地 `cd mobile && npm run generate-types`
    # (frontend 同)并提交。SKIP_DB_INIT=1 让 app.openapi() dump 无需 DB(openapi 只读路由/模型)。
    runs-on: ubuntu-latest
    needs: classify-changes
    if: ${{ needs.classify-changes.outputs.run_type_drift == 'true' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements-dev.txt

      - name: Install backend deps
        working-directory: backend
        run: |
          pip install --require-hashes -r requirements.lock
          pip install -r requirements-dev.txt

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Regenerate client types + assert no drift
        env:
          API_TYPES_USE_CURRENT_ENV: "1"
          API_TYPES_PYTHON: python
        run: ./scripts/generate-api-types.sh --check
