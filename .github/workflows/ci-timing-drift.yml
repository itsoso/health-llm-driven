name: CI timing drift

"on":
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  assess:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Admit only complete backend timing matrices
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID="${{ github.event.workflow_run.id }}"
          REPOSITORY="${{ github.repository }}"
          python scripts/github_actions_read_retry.py \
            --repository "$REPOSITORY" --run-id "$RUN_ID" \
            --resource jobs --output _ci-timing-current-jobs.json
          python scripts/check_ci_timing_observation_scope.py \
            --jobs-json _ci-timing-current-jobs.json \
            --workers 16 --github-output "$GITHUB_OUTPUT"

      - name: Collect exact successful run timing evidence
        if: ${{ steps.scope.outputs.eligible == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID="${{ github.event.workflow_run.id }}"
          HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
          REPOSITORY="${{ github.repository }}"
          mkdir -p _ci-timing/jobs
          python scripts/github_actions_read_retry.py \
            --repository "$REPOSITORY" --run-id "$RUN_ID" \
            --resource logs --output _ci-timing/current-run-logs.zip
          python scripts/github_actions_read_retry.py \
            --repository "$REPOSITORY" \
            --resource runs --output _ci-timing/recent-runs.json
          python -c 'import json,sys; print("\n".join(str(row["databaseId"]) for row in json.load(sys.stdin)))' \
            < _ci-timing/recent-runs.json | while read -r candidate_run_id; do
              python scripts/github_actions_read_retry.py \
                --repository "$REPOSITORY" --run-id "$candidate_run_id" \
                --resource jobs --output "_ci-timing/jobs/${candidate_run_id}.json"
          done
          python scripts/refresh_ci_pytest_timings.py \
            --catalog .github/ci/backend-pytest-shards.json \
            --logs-zip _ci-timing/current-run-logs.zip \
            --run-id "$RUN_ID" --head-sha "$HEAD_SHA" \
            --output _ci-timing/observed-catalog.json

      - name: Assess placement drift without updating main
        if: ${{ steps.scope.outputs.eligible == 'true' }}
        run: |
          python scripts/check_ci_pytest_timing_drift.py \
            --catalog .github/ci/backend-pytest-shards.json \
            --observed _ci-timing/observed-catalog.json \
            --current-run-id "${{ github.event.workflow_run.id }}" \
            --recent-runs _ci-timing/recent-runs.json \
            --jobs-dir _ci-timing/jobs \
            --workers 16 --max-slower-ratio 0.20 \
            --max-runs-since-source 5 \
            --output _ci-timing/drift-report.json

      - name: Upload bounded timing observation
        if: ${{ always() && steps.scope.outputs.eligible == 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: ci-timing-drift-${{ github.event.workflow_run.id }}
          path: |
            _ci-timing/observed-catalog.json
            _ci-timing/drift-report.json
          if-no-files-found: error
          retention-days: 14
