# Pre-commit hooks. 安装一次即可:
#   pip install pre-commit
#   pre-commit install
#
# 之后每次 git commit 自动跑这些检查. 失败则阻止 commit.
# 手动跑全部: pre-commit run --all-files
# 跳过单次: git commit --no-verify

# Vendored 第三方二进制框架 (Rokid CXR-L SDK) 不能被任何 hook 改 —— whitespace/EOF
# 修整会污染 .swiftinterface/.abi.json/binary module, 破坏原厂框架。全局排除。
exclude: '^mobile/modules/rokid-bridge/ios/vendor/RGCxrClient\.framework/'

repos:
  # ── 通用卫生 ──────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.md$'
      - id: end-of-file-fixer
        exclude: '\.md$'
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=2048']
      - id: check-json
        exclude: 'tsconfig.*\.json|\.vscode/'

  # ── Backend (Python) — Ruff lint (不自动修复, 让开发者手动看) ──
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        files: ^backend/app/
        # 只 warn 已知问题, 不阻塞 commit
        args: [--exit-zero]

  - repo: local
    hooks:
      - id: system-map
        name: system map and doc drift
        entry: ./scripts/system-map-check.sh
        language: system
        pass_filenames: false

      - id: dossier-consistency
        name: dossier consistency
        entry: python3 backend/scripts/check_dossier_consistency.py
        language: system
        pass_filenames: false

      # 加 KB claim ≠ 只追一行 claims.jsonl。这道闸复刻 release gate 的两条硬门
      # (manifest 计数 == JSONL 行数 + 无孤儿 claim),纯文件/无 DB,提交前就拦。
      - id: system-kb-seed-integrity
        name: system-kb seed integrity
        entry: python3 backend/scripts/check_system_kb_seed_integrity.py
        language: system
        pass_filenames: false
        files: '^backend/data/system_kb_v2_seed/'

      - id: exact-dependency-versions
        name: exact dependency versions
        entry: node scripts/check-exact-deps.mjs
        language: system
        files: '(^|/)?package\.json$'
