# Pre-commit hooks. 安装一次即可:
#   pip install pre-commit
#   pre-commit install
#
# 之后每次 git commit 自动跑这些检查. 失败则阻止 commit.
# 手动跑全部: pre-commit run --all-files
# 跳过单次: git commit --no-verify

# Vendored 第三方二进制框架 (Rokid CXR-L SDK) 不能被任何 hook 改 —— whitespace/EOF
# 修整会污染 .swiftinterface/.abi.json/binary module, 破坏原厂框架。全局排除。
exclude: '^mobile/modules/rokid-bridge/ios/vendor/RGCxrClient\.framework/'

repos:
  # ── 通用卫生 ──────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.md$'
      - id: end-of-file-fixer
        exclude: '\.md$'
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=2048']
      - id: check-json
        exclude: 'tsconfig.*\.json|\.vscode/'

  # ── Backend (Python) — Ruff lint (不自动修复, 让开发者手动看) ──
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        files: ^backend/app/
        # 只 warn 已知问题, 不阻塞 commit
        args: [--exit-zero]

  - repo: local
    hooks:
      - id: system-map
        name: system map and doc drift
        entry: ./scripts/system-map-check.sh
        language: system
        pass_filenames: false
        # 仅收窄本地提交反馈；CI 仍直接执行完整 central gate。
        files: '^(?:\.pre-commit-config\.yaml$|AGENTS\.md$|CLAUDE\.md$|backend/app/|mobile/app/|frontend/src/app/|mobile/scripts/dump_nav_graph\.py$|docs/(?:ARCHITECTURE\.md$|system-map/|_generated/(?:system-map\.json$|system-map\.schema\.json$|system-map-agent-context\.md$|mobile-nav-graph\.json$))|scripts/(?:check_governed_path_removals\.py$|check_system_map\.py$|check_doc_drift\.py$|dump_system_map\.py$|system_map_(?:context|contract|imports)\.py$|system-map-check\.sh$|system-map-requirements\.txt$)|\.claude/skills/(?:system-map|doc-drift-fix)/)'

      - id: dossier-consistency
        name: dossier consistency
        entry: python3 backend/scripts/check_dossier_consistency.py
        language: system
        pass_filenames: false
        # Dossier 本体、锚点与模板变化才需要扫描全部 dossier。
        files: '^(?:\.pre-commit-config\.yaml$|backend/scripts/check_dossier_consistency\.py$|docs/(?:dossiers|prd|plans|specs)/|\.claude/skills/product-pipeline/|plugins/reva-health-harness/skills/product-pipeline/|scripts/check_governed_path_removals\.py$)'

      - id: agent-skill-governance
        name: agent skill governance
        entry: python3 scripts/check_agent_skill_governance.py check
        language: system
        pass_filenames: false
        # Registry、合同、adapter/plugin 与其 checker 是治理真源。
        files: '^(?:\.pre-commit-config\.yaml$|AGENTS\.md$|docs/(?:agent-skill-binding\.md$|design-agent-operating-harness\.md$|governance/agent-skill-|specs/product-pipeline-contract\.md$|system-map/INDEX\.md$)|\.claude/skills/|plugins/reva-health-harness/|\.agents/plugins/marketplace\.json$|scripts/(?:check_agent_skill_governance|agent_skill_benchmark|check_governed_path_removals)\.py$)'

      # pre-commit 的 files 只看到当前路径；rename-out / deletion 需补查 staged old path。
      - id: governed-path-removals
        name: governed path removal sentinel
        entry: python3.12 scripts/check_governed_path_removals.py
        language: system
        # 两个 anchor 被三条原 hook 共同覆盖；--all-files 时据此避免重复补跑。
        files: '^(?:\.pre-commit-config\.yaml$|scripts/check_governed_path_removals\.py$)'
        pass_filenames: true
        always_run: true

      # 加 KB claim ≠ 只追一行 claims.jsonl。这道闸复刻 release gate 的两条硬门
      # (manifest 计数 == JSONL 行数 + 无孤儿 claim),纯文件/无 DB,提交前就拦。
      - id: system-kb-seed-integrity
        name: system-kb seed integrity
        entry: python3 backend/scripts/check_system_kb_seed_integrity.py
        language: system
        pass_filenames: false
        files: '^backend/data/system_kb_v2_seed/'

      - id: exact-dependency-versions
        name: exact dependency versions
        entry: node scripts/check-exact-deps.mjs
        language: system
        files: '(^|/)?package\.json$'
