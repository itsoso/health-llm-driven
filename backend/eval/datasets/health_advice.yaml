suite: health_advice
description: |
  Deterministic regression suite for user-visible health advice verification.
  The suite exercises genetics, supplements, sleep, movement, labs, and
  paid-content compliance without calling an LLM or database.
cases:
  - id: genetics_mthfr_blocks_5mthf_without_evidence
    description: MTHFR TT cannot imply immediate 5-MTHF supplementation without evidence and metrics.
    tags: [genetics, supplement, high_risk]
    candidate:
      domain: supplement
      title: "MTHFR TT 补充 5-MTHF"
      body: "你需要立刻补充 5-MTHF。"
      evidence_refs: []
      evidence_source_types: []
      verification_metric:
    expected:
      allowed: false
      decision: blocked
      reason: high_risk_missing_evidence
      required_changes_contains: [evidence_refs, verification_metric]
      must_not_include: ["立刻补充 5-MTHF"]

  - id: genetics_mthfr_allows_lab_first_boundary
