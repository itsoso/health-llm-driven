version: "3.8"

services:
  # ─── PostgreSQL Database ────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-health_db}
      POSTGRES_USER: ${POSTGRES_USER:-health_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-health_pass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-health_user} -d ${POSTGRES_DB:-health_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Redis Cache / Message Broker ───────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── FastAPI Backend ────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    environment: &backend-env
      # Database
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-health_db}
      POSTGRES_USER: ${POSTGRES_USER:-health_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-health_pass}
      # Redis
      REDIS_URL: redis://redis:6379/0
      # Application
      APP_ENV: ${APP_ENV:-production}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:3000}
      # LLM / AI
      OPENAI_API_KEY: ${LLM_API_KEY:-}
      OPENAI_BASE_URL: ${LLM_BASE_URL:-}
      OPENAI_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      # Garmin
      GARMIN_EMAIL: ${GARMIN_EMAIL:-}
      GARMIN_PASSWORD: ${GARMIN_PASSWORD:-}
      GARMIN_ENCRYPTION_KEY: ${GARMIN_ENCRYPTION_KEY:-}
      # Encryption
      DEVICE_ENCRYPTION_KEY: ${DEVICE_ENCRYPTION_KEY:-}
      # Weather & Air Quality
      QWEATHER_API_KEY: ${QWEATHER_API_KEY:-}
      QWEATHER_API_TYPE: ${QWEATHER_API_TYPE:-free}
      QWEATHER_API_HOST: ${QWEATHER_API_HOST:-}
      AQICN_API_TOKEN: ${AQICN_API_TOKEN:-}
      # Aliyun Search
      ALIYUN_ACCESS_KEY_ID: ${ALIYUN_ACCESS_KEY_ID:-}
      ALIYUN_ACCESS_KEY_SECRET: ${ALIYUN_ACCESS_KEY_SECRET:-}
      # WeChat Mini Program
      WECHAT_APPID: ${WECHAT_APPID:-}
      WECHAT_SECRET: ${WECHAT_SECRET:-}
      # Invite code
      DEFAULT_INVITE_CODE: ${DEFAULT_INVITE_CODE:-LLM}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─── MCP Server (Model Context Protocol) ───────────────────────────
  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    environment:
      HEALTH_API_URL: http://backend:8000/api/v1
      HEALTH_API_TOKEN: ${MCP_API_TOKEN:-}
      MCP_TRANSPORT: sse
      MCP_SSE_PORT: "8808"
    ports:
      - "127.0.0.1:${MCP_PORT:-8808}:8808"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # ─── Celery Worker ──────────────────────────────────────────────────
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    command: celery -A app.celery_app:celery_app worker --loglevel=info --concurrency=4
    environment:
      <<: *backend-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─── Celery Beat Scheduler ─────────────────────────────────────────
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    command: celery -A app.celery_app:celery_app beat --loglevel=info
    environment:
      <<: *backend-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─── Next.js Frontend ──────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        BACKEND_URL: http://backend:8000
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
